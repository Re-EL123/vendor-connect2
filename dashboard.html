<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Connect - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 via-indigo-100 to-purple-100 min-h-screen">
  <header class="p-4 bg-white/80 backdrop-blur shadow">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-extrabold text-indigo-700">Street Connect</h1>
      <nav class="flex gap-4 text-sm">
        <button onclick="window.location.href='feed.html'" class="text-gray-600 hover:text-indigo-600">Feed</button>
        <button onclick="window.location.href='profile.html'" class="text-gray-600 hover:text-indigo-600">Profile</button>
        <button onclick="logout()" class="text-red-600 hover:text-red-700">Logout</button>
      </nav>
    </div>
  </header>

  <div class="max-w-7xl mx-auto py-10 px-4">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Left Column - User Info & Quick Actions -->
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6">
          <h2 class="text-xl font-bold text-indigo-700 mb-4">User Info</h2>
          <div id="userInfo" class="space-y-2 text-sm"></div>
        </div>

        <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6">
          <h2 class="text-xl font-semibold text-indigo-700 mb-4">Subscription</h2>
          <p id="subscriptionType" class="mb-4 text-lg font-medium">Loading...</p>
          <button onclick="goToSettings()" class="w-full bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
            Upgrade / Manage
          </button>
        </div>

        <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6">
          <h2 class="text-xl font-semibold text-indigo-700 mb-4">Quick Actions</h2>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="window.location.href='feed.html'" class="bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 text-sm">
              📝 Feed
            </button>
            <button onclick="window.location.href='marketplace.html'" class="bg-purple-600 text-white p-3 rounded-lg hover:bg-purple-700 text-sm">
              🛒 Market
            </button>
            <button onclick="window.location.href='wallet.html'" class="bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 text-sm">
              💳 Wallet
            </button>
            <button onclick="window.location.href='inbox.html'" class="bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 text-sm">
              💬 Inbox
            </button>
          </div>
        </div>
      </div>

      <!-- Right Column - Orders Section -->
      <div class="lg:col-span-2">
        <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-indigo-700">My Orders</h2>
            <select id="orderFilter" class="px-4 py-2 border border-gray-300 rounded-lg text-sm">
              <option value="all">All Orders</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>

          <!-- Upgrade Prompt for Basic Users -->
          <div id="upgradePrompt" class="hidden text-center py-12">
            <div class="mb-4">
              <svg class="w-20 h-20 mx-auto text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-700 mb-2">Upgrade to View Orders</h3>
            <p class="text-gray-600 mb-6">Order management is available for Business and Premium subscribers</p>
            <button onclick="window.location.href='subscription.html'" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-3 rounded-lg hover:shadow-lg font-semibold">
              Upgrade Now
            </button>
          </div>

          <!-- Orders List -->
          <div id="ordersContainer" class="space-y-4">
            <div class="text-center py-8 text-gray-500">
              <p>Loading orders...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Order Details Modal -->
  <div id="orderModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-2xl font-bold text-gray-800">Order Details</h3>
        <button onclick="closeOrderModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
      </div>

      <div id="orderDetailsContent"></div>

      <div class="mt-6 flex gap-3">
        <button onclick="closeOrderModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
      authDomain: "online-mall-4422.firebaseapp.com",
      databaseURL: "https://online-mall-4422-default-rtdb.firebaseio.com",
      projectId: "online-mall-4422",
      storageBucket: "online-mall-4422.appspot.com",
      messagingSenderId: "947082232783",
      appId: "1:947082232783:web:116206502e5fb38383c8ba",
      measurementId: "G-LNTNZQBGL8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const firestoreDb = firebase.firestore();
    const realtimeDb = firebase.database();

    let currentUser = null;
    let userSubscription = 'basic';
    let allOrders = [];

    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      currentUser = user;
      const uid = user.uid;
      const doc = await firestoreDb.collection("users").doc(uid).get();

      if (!doc.exists) {
        document.getElementById("userInfo").innerHTML = `
          <p><strong>Email:</strong> ${user.email}</p>
          <p class="text-gray-600 mt-2">Complete your profile in settings</p>
        `;
        document.getElementById("subscriptionType").innerText = "Basic Plan (Free)";
        userSubscription = 'basic';
        showUpgradePrompt();
        return;
      }

      const data = doc.data();
      userSubscription = data.subscriptionType || 'basic';

      document.getElementById("userInfo").innerHTML = `
        <p><strong>Name:</strong> ${data.name || data.fullName || "Not set"}</p>
        <p><strong>Email:</strong> ${data.email || user.email}</p>
        <p><strong>Phone:</strong> ${data.phone || "Not set"}</p>
        <p><strong>Location:</strong> ${data.city || "Not set"}, ${data.province || "Not set"}</p>
        <p><strong>Role:</strong> ${data.isVendor ? 'Vendor (' + (data.subscriptionType || 'basic') + ')' : 'User (basic)'}</p>
      `;

      document.getElementById("subscriptionType").innerText = `${(data.subscriptionType || 'basic').charAt(0).toUpperCase() + (data.subscriptionType || 'basic').slice(1)} Plan`;

      if (userSubscription === 'basic') {
        showUpgradePrompt();
      } else {
        loadOrders();
      }
    });

    function showUpgradePrompt() {
      document.getElementById("upgradePrompt").classList.remove("hidden");
      document.getElementById("ordersContainer").classList.add("hidden");
    }

    async function loadOrders() {
      try {
        document.getElementById("upgradePrompt").classList.add("hidden");
        document.getElementById("ordersContainer").classList.remove("hidden");

        const ordersRef = realtimeDb.ref("orders");
        ordersRef.orderByChild("userId").equalTo(currentUser.uid).on("value", snapshot => {
          allOrders = [];

          if (!snapshot.exists()) {
            renderOrders([]);
            return;
          }

          snapshot.forEach(childSnapshot => {
            allOrders.push({
              id: childSnapshot.key,
              ...childSnapshot.val()
            });
          });

          allOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          renderOrders(allOrders);
        });
      } catch (error) {
        console.error("Error loading orders:", error);
        document.getElementById("ordersContainer").innerHTML = `
          <div class="text-center py-8 text-red-600">
            <p>Error loading orders. Please refresh the page.</p>
          </div>
        `;
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById("ordersContainer");

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12">
            <div class="mb-4">
              <svg class="w-20 h-20 mx-auto text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-700 mb-2">No Orders Yet</h3>
            <p class="text-gray-600 mb-4">Start shopping in the marketplace to see your orders here</p>
            <button onclick="window.location.href='marketplace.html'" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
              Browse Marketplace
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(order => {
        const date = new Date(order.createdAt);
        const statusColors = {
          pending: 'bg-yellow-100 text-yellow-800',
          confirmed: 'bg-blue-100 text-blue-800',
          shipped: 'bg-purple-100 text-purple-800',
          delivered: 'bg-green-100 text-green-800',
          cancelled: 'bg-red-100 text-red-800'
        };

        const itemCount = order.items ? order.items.length : 0;
        const firstItem = order.items && order.items.length > 0 ? order.items[0] : null;

        return `
          <div class="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
            <div class="flex items-start justify-between mb-3">
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-2">
                  <span class="text-xs font-mono text-gray-500">Order #${order.id.substring(0, 8)}</span>
                  <span class="text-xs px-2 py-1 rounded-full ${statusColors[order.status] || 'bg-gray-100 text-gray-800'}">
                    ${(order.status || 'pending').charAt(0).toUpperCase() + (order.status || 'pending').slice(1)}
                  </span>
                </div>
                <p class="text-sm text-gray-600">${date.toLocaleDateString()} at ${date.toLocaleTimeString()}</p>
                <p class="text-sm text-gray-600 mt-1">${itemCount} item${itemCount !== 1 ? 's' : ''}</p>
              </div>
              <div class="text-right">
                <p class="text-lg font-bold text-indigo-700">R ${parseFloat(order.total || 0).toFixed(2)}</p>
              </div>
            </div>

            ${firstItem ? `
              <div class="flex items-center gap-3 mb-3 p-2 bg-gray-50 rounded">
                ${firstItem.imageURL ? `<img src="${firstItem.imageURL}" class="w-12 h-12 rounded object-cover" />` : '<div class="w-12 h-12 bg-gray-200 rounded"></div>'}
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-gray-800 truncate">${firstItem.name || 'Product'}</p>
                  <p class="text-xs text-gray-600">Qty: ${firstItem.qty || 1} × R${parseFloat(firstItem.price || 0).toFixed(2)}</p>
                </div>
              </div>
              ${itemCount > 1 ? `<p class="text-xs text-gray-500 mb-3">+ ${itemCount - 1} more item${itemCount - 1 !== 1 ? 's' : ''}</p>` : ''}
            ` : ''}

            <div class="flex gap-2">
              <button onclick="viewOrderDetails('${order.id}')" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium">
                View Details
              </button>
              ${order.status === 'pending' ? `
                <button onclick="cancelOrder('${order.id}')" class="px-4 py-2 border border-red-600 text-red-600 rounded-lg hover:bg-red-50 text-sm font-medium">
                  Cancel
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    window.viewOrderDetails = function(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      if (!order) return;

      const date = new Date(order.createdAt);
      const statusColors = {
        pending: 'bg-yellow-100 text-yellow-800',
        confirmed: 'bg-blue-100 text-blue-800',
        shipped: 'bg-purple-100 text-purple-800',
        delivered: 'bg-green-100 text-green-800',
        cancelled: 'bg-red-100 text-red-800'
      };

      document.getElementById("orderDetailsContent").innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-start pb-4 border-b">
            <div>
              <p class="text-sm text-gray-600">Order ID</p>
              <p class="font-mono text-sm">${order.id}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-sm font-medium ${statusColors[order.status] || 'bg-gray-100 text-gray-800'}">
              ${(order.status || 'pending').charAt(0).toUpperCase() + (order.status || 'pending').slice(1)}
            </span>
          </div>

          <div>
            <p class="text-sm text-gray-600 mb-1">Order Date</p>
            <p class="font-medium">${date.toLocaleDateString()} at ${date.toLocaleTimeString()}</p>
          </div>

          <div>
            <p class="text-sm font-semibold text-gray-800 mb-3">Items Ordered</p>
            <div class="space-y-3">
              ${order.items ? order.items.map(item => `
                <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
                  ${item.imageURL ? `<img src="${item.imageURL}" class="w-16 h-16 rounded object-cover" />` : '<div class="w-16 h-16 bg-gray-200 rounded"></div>'}
                  <div class="flex-1">
                    <p class="font-medium text-gray-800">${item.name || 'Product'}</p>
                    <p class="text-sm text-gray-600">Quantity: ${item.qty || 1}</p>
                    <p class="text-sm text-gray-600">Price: R${parseFloat(item.price || 0).toFixed(2)}</p>
                  </div>
                  <div class="text-right">
                    <p class="font-bold text-indigo-700">R${(parseFloat(item.price || 0) * (item.qty || 1)).toFixed(2)}</p>
                  </div>
                </div>
              `).join('') : '<p class="text-gray-500">No items</p>'}
            </div>
          </div>

          <div class="pt-4 border-t space-y-2">
            <div class="flex justify-between text-sm">
              <span class="text-gray-600">Subtotal</span>
              <span class="font-medium">R${parseFloat(order.subtotal || 0).toFixed(2)}</span>
            </div>
            <div class="flex justify-between text-sm">
              <span class="text-gray-600">Delivery Fee</span>
              <span class="font-medium">R${parseFloat(order.deliveryFee || 0).toFixed(2)}</span>
            </div>
            <div class="flex justify-between text-lg font-bold pt-2 border-t">
              <span>Total</span>
              <span class="text-indigo-700">R${parseFloat(order.total || 0).toFixed(2)}</span>
            </div>
          </div>

          ${order.status === 'pending' ? `
            <div class="pt-4 border-t">
              <button onclick="updateOrderStatus('${order.id}', 'confirmed')" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 mb-2">
                Mark as Confirmed
              </button>
              <button onclick="updateOrderStatus('${order.id}', 'cancelled')" class="w-full border border-red-600 text-red-600 px-4 py-2 rounded-lg hover:bg-red-50">
                Cancel Order
              </button>
            </div>
          ` : order.status === 'confirmed' ? `
            <div class="pt-4 border-t">
              <button onclick="updateOrderStatus('${order.id}', 'shipped')" class="w-full bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">
                Mark as Shipped
              </button>
            </div>
          ` : order.status === 'shipped' ? `
            <div class="pt-4 border-t">
              <button onclick="updateOrderStatus('${order.id}', 'delivered')" class="w-full bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
                Mark as Delivered
              </button>
            </div>
          ` : ''}
        </div>
      `;

      document.getElementById("orderModal").classList.remove("hidden");
    };

    window.closeOrderModal = function() {
      document.getElementById("orderModal").classList.add("hidden");
    };

    window.updateOrderStatus = async function(orderId, newStatus) {
      if (!confirm(`Change order status to ${newStatus}?`)) return;

      try {
        await realtimeDb.ref(`orders/${orderId}`).update({
          status: newStatus,
          updatedAt: new Date().toISOString()
        });

        alert(`Order status updated to ${newStatus}`);
        closeOrderModal();
      } catch (error) {
        console.error("Error updating order:", error);
        alert("Failed to update order status");
      }
    };

    window.cancelOrder = async function(orderId) {
      if (!confirm("Are you sure you want to cancel this order?")) return;

      try {
        await realtimeDb.ref(`orders/${orderId}`).update({
          status: 'cancelled',
          updatedAt: new Date().toISOString()
        });

        alert("Order cancelled successfully");
      } catch (error) {
        console.error("Error cancelling order:", error);
        alert("Failed to cancel order");
      }
    };

    document.getElementById("orderFilter").addEventListener("change", function() {
      const filter = this.value;

      if (filter === "all") {
        renderOrders(allOrders);
      } else {
        const filtered = allOrders.filter(o => o.status === filter);
        renderOrders(filtered);
      }
    });

    function logout() {
      auth.signOut().then(() => window.location.href = "login.html");
    }

    function goToSettings() {
      window.location.href = "settings.html";
    }
  </script>
</body>
</html>
