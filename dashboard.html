<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Street Connect</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-badge {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    .metric-card {
      transition: all 0.3s ease;
    }
    .metric-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 25px -5px rgba(0, 0,0, 0.1);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

<!-- Header -->
<header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <button onclick="window.history.back()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="arrow-left" class="w-5 h-5 text-gray-600"></i>
      </button>
      <h1 class="text-2xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
        Dashboard
      </h1>
    </div>
    
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='feed.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="home" class="w-5 h-5 text-gray-600"></i>
      </button>
      <button onclick="window.location.href='search.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="search" class="w-5 h-5 text-gray-600"></i>
      </button>
      <button id="notifBtn" onclick="window.location.href='notifications.html'" class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="bell" class="w-5 h-5 text-gray-600"></i>
        <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full min-w-[20px] h-5 flex items-center justify-center font-bold px-1 pulse-badge"></span>
      </button>
      <div id="userAvatar" class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-semibold text-sm cursor-pointer" onclick="window.location.href='profile.html'"></div>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-8">
  <!-- User Profile Card -->
  <div class="bg-white rounded-3xl shadow-2xl p-8 mb-8 fade-in">
    <div class="flex flex-col md:flex-row items-center md:items-start gap-6">
      <div class="flex-shrink-0">
        <div id="profileAvatar" class="w-24 h-24 rounded-3xl bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-3xl shadow-2xl border-4 border-white"></div>
      </div>
      <div class="flex-1 text-center md:text-left">
        <h2 id="dashboardUserName" class="text-3xl font-extrabold text-gray-900 mb-2"></h2>
        <p id="dashboardUserType" class="text-xl text-gray-500 mb-4 bg-blue-100 inline-block px-4 py-2 rounded-2xl font-semibold"></p>
        <div class="flex flex-wrap gap-4 justify-center md:justify-start">
          <button onclick="window.location.href='profile.html'" class="px-8 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-2xl font-semibold hover:shadow-xl transition-all">
            <i data-lucide="user" class="w-5 h-5 inline mr-2"></i>View Profile
          </button>
          <button onclick="window.location.href='subscription.html'" class="px-8 py-3 border-2 border-blue-600 text-blue-600 rounded-2xl font-semibold hover:bg-blue-600 hover:text-white transition-all">
            <i data-lucide="zap" class="w-5 h-5 inline mr-2"></i>Upgrade Plan
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6 mb-8">
    <!-- Key Metrics -->
    <div class="metric-card bg-white rounded-3xl shadow-xl p-8 hover:shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="p-3 bg-blue-100 rounded-2xl">
          <i data-lucide="eye" class="w-8 h-8 text-blue-600"></i>
        </div>
        <div id="viewsTrend" class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
      </div>
      <h3 class="text-3xl font-bold text-gray-900 mb-1" id="totalViews">0</h3>
      <p class="text-gray-500 font-medium">Total Post Views</p>
    </div>

    <div class="metric-card bg-white rounded-3xl shadow-xl p-8 hover:shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="p-3 bg-red-100 rounded-2xl">
          <i data-lucide="heart" class="w-8 h-8 text-red-500 fill-current"></i>
        </div>
        <div id="likesTrend" class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
      </div>
      <h3 class="text-3xl font-bold text-gray-900 mb-1" id="totalLikes">0</h3>
      <p class="text-gray-500 font-medium">Total Likes</p>
    </div>

    <div class="metric-card bg-white rounded-3xl shadow-xl p-8 hover:shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="p-3 bg-orange-100 rounded-2xl">
          <i data-lucide="shopping-bag" class="w-8 h-8 text-orange-600"></i>
        </div>
        <div id="ordersTrend" class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
      </div>
      <h3 class="text-3xl font-bold text-gray-900 mb-1" id="totalOrders">0</h3>
      <p class="text-gray-500 font-medium">New Orders</p>
    </div>

    <div class="metric-card bg-white rounded-3xl shadow-xl p-8 hover:shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <div class="p-3 bg-purple-100 rounded-2xl">
          <i data-lucide="package" class="w-8 h-8 text-purple-600"></i>
        </div>
        <div id="productsTrend" class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
      </div>
      <h3 class="text-3xl font-bold text-gray-900 mb-1" id="totalProducts">0</h3>
      <p class="text-gray-500 font-medium">Products Listed</p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- New Orders -->
    <div class="lg:col-span-2">
      <div class="bg-white rounded-3xl shadow-2xl p-8">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-3">
            <i data-lucide="shopping-cart" class="w-8 h-8 text-orange-600"></i>
            New Orders
          </h2>
          <button onclick="window.location.href='orders.html'" class="text-blue-600 hover:text-blue-700 font-semibold flex items-center gap-1">
            View All <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="ordersList" class="space-y-4 max-h-96 overflow-y-auto">
          <div class="text-center py-12 text-gray-500">
            <i data-lucide="shopping-cart" class="w-16 h-16 mx-auto mb-4 opacity-50"></i>
            <p>Loading your recent orders...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div>
      <div class="bg-white rounded-3xl shadow-2xl p-8 sticky top-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-8">Quick Actions</h2>
        <div class="space-y-4">
          <button onclick="window.location.href='create-product.html'" class="w-full flex items-center gap-3 p-4 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-2xl hover:shadow-xl transition-all font-semibold">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            List New Product
          </button>
          <button onclick="window.location.href='feed.html'" class="w-full flex items-center gap-3 p-4 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-2xl hover:shadow-xl transition-all font-semibold">
            <i data-lucide="edit-3" class="w-6 h-6"></i>
            Create Post
          </button>
          <button onclick="window.location.href='analytics.html'" class="w-full flex items-center gap-3 p-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-2xl hover:shadow-xl transition-all font-semibold">
            <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
            View Analytics
          </button>
          <button onclick="window.location.href='marketplace.html'" class="w-full flex items-center gap-3 p-4 border-2 border-gray-200 rounded-2xl hover:border-gray-400 transition-all font-semibold text-gray-700 hover:bg-gray-50">
            <i data-lucide="shopping-bag" class="w-6 h-6"></i>
            Manage Products
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- My Products Section -->
  <div class="mt-12">
    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-3">
          <i data-lucide="package" class="w-8 h-8 text-emerald-600"></i>
          My Products
        </h2>
        <button onclick="window.location.href='manage-products.html'" class="text-blue-600 hover:text-blue-700 font-semibold flex items-center gap-1">
          Manage All <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="productsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="text-center py-12 text-gray-500 rounded-2xl border-2 border-dashed border-gray-200">
          <i data-lucide="package-plus" class="w-16 h-16 mx-auto mb-4 opacity-50 text-emerald-400"></i>
          <p class="text-lg font-semibold">No products listed yet</p>
          <p class="text-sm mt-2">Create your first product to get started</p>
          <button onclick="window.location.href='create-product.html'" class="mt-4 px-6 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
            List Product
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 shadow-2xl md:hidden">
    <div class="flex justify-around py-3">
      <a href="feed.html" class="flex flex-col items-center text-blue-600">
        <i data-lucide="home" class="w-6 h-6"></i>
        <span class="text-xs font-semibold mt-1">Feed</span>
      </a>
      <a href="marketplace.html" class="flex flex-col items-center text-gray-600 relative">
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Market</span>
      </a>
      <a href="dashboard.html" class="flex flex-col items-center text-blue-600">
        <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
        <span class="text-xs font-semibold mt-1">Dashboard</span>
      </a>
      <a href="inbox.html" class="flex flex-col items-center text-gray-600 relative">
        <i data-lucide="message-circle" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Inbox</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center text-gray-600">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Profile</span>
      </a>
    </div>
  </nav>
</div>

<script type="module">
  lucide.createIcons();
  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
    authDomain: "online-mall-4422.firebaseapp.com",
    projectId: "online-mall-4422",
    storageBucket: "online-mall-4422.appspot.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;
  let userProfile = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    
    currentUser = user;
    await loadDashboardData();
  });

  async function loadDashboardData() {
    try {
      await loadUserProfile();
      await loadAnalytics();
      await loadOrders();
      await loadProducts();
      await loadNotificationsBadge();
    } catch (error) {
      console.error('Error loading dashboard:', error);
    }
  }

  async function loadUserProfile() {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
      userProfile = userDoc.data();
      setupProfileDisplay();
    }
  }

  function setupProfileDisplay() {
    const displayName = userProfile.businessName || userProfile.name || 'User';
    const initial = displayName.charAt(0).toUpperCase();
    
    document.getElementById('dashboardUserName').textContent = displayName;
    document.getElementById('dashboardUserType').textContent = 
      userProfile.subscriptionType === 'business' ? 'Business Account' : 'Basic Account';
    
    document.getElementById('profileAvatar').textContent = initial;
    document.getElementById('userAvatar').textContent = initial;
  }

  async function loadAnalytics() {
    try {
      // Posts analytics
      const postsQuery = query(collection(db, "posts"), where("uid", "==", currentUser.uid));
      const postsSnap = await getDocs(postsQuery);
      
      let totalViews = 0;
      let totalLikes = 0;
      
      postsSnap.forEach(postDoc => {
        const post = postDoc.data();
        totalViews += post.views || 0;
        totalLikes += (post.likes || []).length;
      });

      // Orders count
      const ordersQuery = query(collection(db, "marketplace_orders"), where("vendorId", "==", currentUser.uid));
      const ordersSnap = await getDocs(ordersQuery);
      document.getElementById('totalOrders').textContent = ordersSnap.size.toLocaleString();

      // Products count from vendors collection
      const vendorQuery = query(collection(db, "vendors"), where("uid", "==", currentUser.uid));
      const vendorSnap = await getDocs(vendorQuery);
      let totalProducts = 0;
      vendorSnap.forEach(vendorDoc => {
        const vendor = vendorDoc.data();
        if (vendor.products) totalProducts += Object.keys(vendor.products).length;
      });
      
      document.getElementById('totalViews').textContent = totalViews.toLocaleString();
      document.getElementById('totalLikes').textContent = totalLikes.toLocaleString();
      document.getElementById('totalProducts').textContent = totalProducts.toLocaleString();
      
    } catch (error) {
      console.error('Error loading analytics:', error);
    }
  }

  async function loadOrders() {
    try {
      const ordersQuery = query(
        collection(db, "marketplace_orders"), 
        where("vendorId", "==", currentUser.uid),
        orderBy("createdAt", "desc"),
        limit(5)
      );
      const ordersSnap = await getDocs(ordersQuery);
      
      const ordersList = document.getElementById('ordersList');
      if (ordersSnap.empty) {
        ordersList.innerHTML = `
          <div class="text-center py-12 text-gray-500">
            <i data-lucide="shopping-cart" class="w-16 h-16 mx-auto mb-4 opacity-50"></i>
            <p class="text-lg font-semibold">No orders yet</p>
            <p class="text-sm mt-2">List products to start receiving orders</p>
          </div>
        `;
      } else {
        ordersList.innerHTML = Array.from(ordersSnap.docs).map(doc => {
          const order = doc.data();
          const timeAgo = getTimeAgo(order.createdAt);
          const statusColor = order.status === 'pending' ? 'orange' : order.status === 'shipped' ? 'blue' : 'green';
          
          return `
            <div class="flex items-start gap-4 p-6 bg-gradient-to-r from-${statusColor}-50 to-${statusColor}-100 rounded-2xl border-l-4 border-${statusColor}-500 hover:shadow-lg transition-all">
              <div class="flex-shrink-0 w-12 h-12 rounded-2xl bg-${statusColor}-500 flex items-center justify-center text-white font-bold text-sm flex-shrink-0">
                ${order.products ? Object.values(order.products)[0]?.name?.charAt(0).toUpperCase() || 'O' : 'O'}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between mb-2">
                  <h4 class="font-bold text-lg text-gray-900 truncate">Order #${doc.id.slice(-6)}</h4>
                  <span class="px-3 py-1 bg-white rounded-full text-xs font-bold text-${statusColor}-700">
                    ${order.status || 'Pending'}
                  </span>
                </div>
                <p class="text-sm text-gray-600 mb-1">R${order.totalAmount?.toLocaleString() || '0'}</p>
                <p class="text-xs text-gray-500">${order.buyerId?.slice(-6)} • ${timeAgo}</p>
              </div>
            </div>
          `;
        }).join('');
      }
      lucide.createIcons();
    } catch (error) {
      console.error('Error loading orders:', error);
    }
  }

  async function loadProducts() {
    try {
      const vendorQuery = query(collection(db, "vendors"), where("uid", "==", currentUser.uid));
      const vendorSnap = await getDocs(vendorQuery);
      
      const productsList = document.getElementById('productsList');
      
      if (vendorSnap.empty) {
        productsList.innerHTML = `
          <div class="text-center py-12 text-gray-500 rounded-2xl border-2 border-dashed border-gray-200 col-span-full">
            <i data-lucide="package-plus" class="w-16 h-16 mx-auto mb-4 opacity-50 text-emerald-400"></i>
            <p class="text-lg font-semibold">No products listed yet</p>
            <p class="text-sm mt-2">Create your first product to get started</p>
            <button onclick="window.location.href='create-product.html'" class="mt-4 px-6 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
              List Product
            </button>
          </div>
        `;
        return;
      }

      let allProducts = [];
      vendorSnap.forEach(vendorDoc => {
        const vendor = vendorDoc.data();
        if (vendor.products) {
          Object.entries(vendor.products).forEach(([productId, product]) => {
            allProducts.push({ id: productId, ...product, vendorId: vendorDoc.id });
          });
        }
      });

      allProducts.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      const topProducts = allProducts.slice(0, 3);

      if (topProducts.length === 0) {
        productsList.innerHTML = `
          <div class="text-center py-12 text-gray-500 rounded-2xl border-2 border-dashed border-gray-200 col-span-full">
            <i data-lucide="package-plus" class="w-16 h-16 mx-auto mb-4 opacity-50 text-emerald-400"></i>
            <p class="text-lg font-semibold">No products listed yet</p>
            <p class="text-sm mt-2">Create your first product to get started</p>
            <button onclick="window.location.href='create-product.html'" class="mt-4 px-6 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
              List Product
            </button>
          </div>
        `;
      } else {
        productsList.innerHTML = topProducts.map(product => `
          <div class="group bg-gradient-to-b from-gray-50 to-white rounded-2xl p-6 shadow-lg hover:shadow-2xl transition-all border hover:border-emerald-200 cursor-pointer" onclick="window.location.href='product-details.html?id=${product.id}'">
            <div class="w-full h-32 bg-gradient-to-r from-emerald-100 to-teal-100 rounded-xl flex items-center justify-center mb-4 overflow-hidden">
              ${product.imageURL ? `<img src="${product.imageURL}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">` : 
                `<i data-lucide="package" class="w-16 h-16 text-emerald-400"></i>`}
            </div>
            <h4 class="font-bold text-lg text-gray-900 mb-2 truncate">${product.name}</h4>
            <p class="text-emerald-600 font-bold text-xl mb-2">R${product.price?.toLocaleString() || '0'}</p>
            <p class="text-sm text-gray-500 mb-3">${product.category}</p>
            <div class="flex items-center justify-between">
              <span class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold">
                ${product.isApproved ? '✅ Approved' : '⏳ Pending'}
              </span>
              <span class="text-xs text-gray-500">${getTimeAgo(product.createdAt)}</span>
            </div>
          </div>
        `).join('');
      }
      
      lucide.createIcons();
    } catch (error) {
      console.error('Error loading products:', error);
    }
  }

  async function loadNotificationsBadge() {
    try {
      const notifQuery = query(
        collection(db, "notifications"),
        where("recipientId", "==", currentUser.uid),
        where("read", "==", false)
      );
      const notifSnap = await getDocs(notifQuery);
      const unreadCount = notifSnap.size;
      
      if (unreadCount > 0) {
        const badge = document.getElementById('notifBadge');
        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
        badge.classList.remove('hidden');
      }
    } catch (error) {
      console.error('Error loading notifications:', error);
    }
  }

  function getTimeAgo(timestamp) {
    if (!timestamp || !timestamp.seconds) return 'Just now';
    
    const now = Date.now();
    const postTime = timestamp.seconds * 1000;
    const diff = now - postTime;
    
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    
    if (days > 0) return `${days}d ago`;
    if (hours > 0) return `${hours}h ago`;
    if (minutes > 0) return `${minutes}m ago`;
    return 'Just now';
  }
</script>

</body>
</html>
