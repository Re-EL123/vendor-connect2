<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Connect - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-100 via-indigo-100 to-purple-100 min-h-screen">
  <header class="p-4 bg-white/80 backdrop-blur shadow">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-extrabold text-indigo-700">Street Connect</h1>
      <nav class="flex gap-4 text-sm">
        <button onclick="window.location.href='feed.html'" class="text-gray-600 hover:text-indigo-600">Feed</button>
        <button onclick="window.location.href='profile.html'" class="text-gray-600 hover:text-indigo-600">Profile</button>
        <button onclick="logout()" class="text-red-600 hover:text-red-700">Logout</button>
      </nav>
    </div>
  </header>

  <div class="max-w-4xl mx-auto py-10 px-4">
    <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6 mb-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-indigo-700">Welcome to Street Connect</h2>
      </div>

      <div id="userInfo" class="mb-6 p-4 bg-gray-50 rounded-lg"></div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button onclick="window.location.href='feed.html'" class="bg-indigo-600 text-white p-4 rounded-lg hover:bg-indigo-700">
          📝 View Feed
        </button>
        <button onclick="window.location.href='marketplace.html'" class="bg-purple-600 text-white p-4 rounded-lg hover:bg-purple-700">
          🛒 Browse Marketplace
        </button>
        <button onclick="window.location.href='wallet.html'" class="bg-blue-600 text-white p-4 rounded-lg hover:bg-blue-700">
          💳 My Wallet
        </button>
        <button onclick="window.location.href='inbox.html'" class="bg-green-600 text-white p-4 rounded-lg hover:bg-green-700">
          💬 Messages
        </button>
      </div>
    </div>

    <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6">
      <h2 class="text-xl font-semibold text-indigo-700 mb-4">Your Subscription</h2>
      <p id="subscriptionType" class="mb-4">Loading...</p>
      <button onclick="goToSettings()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
        Upgrade / Manage Subscription
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
      authDomain: "online-mall-4422.firebaseapp.com",
      databaseURL: "https://online-mall-4422-default-rtdb.firebaseio.com",
      projectId: "online-mall-4422",
      storageBucket: "online-mall-4422.appspot.com",
      messagingSenderId: "947082232783",
      appId: "1:947082232783:web:116206502e5fb38383c8ba",
      measurementId: "G-LNTNZQBGL8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const uid = user.uid;
      const doc = await db.collection("users").doc(uid).get();

      if (!doc.exists) {
        document.getElementById("userInfo").innerHTML = `
          <p><strong>Email:</strong> ${user.email}</p>
          <p class="text-sm text-gray-600 mt-2">Complete your profile in settings</p>
        `;
        document.getElementById("subscriptionType").innerText = "Basic Plan (Free)";
        return;
      }

      const data = doc.data();

      document.getElementById("userInfo").innerHTML = `
        <p><strong>Name:</strong> ${data.name || data.fullName || "Not set"}</p>
        <p><strong>Email:</strong> ${data.email || user.email}</p>
        <p><strong>Phone:</strong> ${data.phone || "Not set"}</p>
        <p><strong>Location:</strong> ${data.city || "Not set"}, ${data.province || "Not set"}</p>
        <p><strong>Role:</strong> ${data.isVendor ? 'Vendor (' + (data.subscriptionType || 'basic') + ')' : 'User (basic)'}</p>
      `;

      document.getElementById("subscriptionType").innerText = `${(data.subscriptionType || 'basic').charAt(0).toUpperCase() + (data.subscriptionType || 'basic').slice(1)} Plan`;
    });

    function logout() {
      auth.signOut().then(() => window.location.href = "login.html");
    }

    function goToSettings() {
      window.location.href = "settings.html";
    }
  </script>
</body>
</html>
