<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - Street Connect</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-badge {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

<!-- Header -->
<header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="text-2xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
      Street Connect
    </h1>
    
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='feed.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="home" class="w-5 h-5 text-gray-600"></i>
      </button>
      <button onclick="window.location.href='search.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="search" class="w-5 h-5 text-gray-600"></i>
      </button>
      <button id="notifBtn" onclick="window.location.href='notifications.html'" class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="bell" class="w-5 h-5 text-gray-600"></i>
        <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full min-w-[20px] h-5 flex items-center justify-center font-bold px-1 pulse-badge"></span>
      </button>
      <button onclick="window.location.href='inbox.html'" class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="message-circle" class="w-5 h-5 text-gray-600"></i>
        <span id="messageBadge" class="hidden absolute -top-1 -right-1 bg-green-500 text-white text-xs rounded-full min-w-[20px] h-5 flex items-center justify-center font-bold px-1 pulse-badge"></span>
      </button>
      <button onclick="window.location.href='settings.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="settings" class="w-5 h-5 text-gray-600"></i>
      </button>
      <div id="userAvatar" class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-semibold text-sm cursor-pointer"
        onclick="window.location.href='profile.html'">
      </div>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-6 mb-20">
  
  <!-- User Info Card -->
  <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 fade-in">
    <div class="flex flex-col md:flex-row gap-6">
      <div class="flex-shrink-0">
        <div id="profileAvatar" class="w-24 h-24 rounded-2xl bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-3xl shadow-lg"></div>
      </div>
      <div class="flex-1">
        <h2 id="dashboardUserName" class="text-2xl font-bold text-gray-900 mb-2"></h2>
        <p id="dashboardUserType" class="text-sm bg-blue-100 text-blue-800 inline-block px-3 py-1 rounded-full font-semibold mb-3"></p>
        <div id="userInfoGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
          <div class="flex items-center gap-2">
            <i data-lucide="mail" class="w-4 h-4 text-gray-400"></i>
            <span id="userEmail" class="text-gray-700"></span>
          </div>
          <div class="flex items-center gap-2">
            <i data-lucide="phone" class="w-4 h-4 text-gray-400"></i>
            <span id="userPhone" class="text-gray-700"></span>
          </div>
          <div class="flex items-center gap-2">
            <i data-lucide="map-pin" class="w-4 h-4 text-gray-400"></i>
            <span id="userLocation" class="text-gray-700"></span>
          </div>
          <div class="flex items-center gap-2">
            <i data-lucide="briefcase" class="w-4 h-4 text-gray-400"></i>
            <span id="userCategory" class="text-gray-700"></span>
          </div>
          <div id="userAddressContainer" class="hidden md:col-span-2 flex items-start gap-2">
            <i data-lucide="home" class="w-4 h-4 text-gray-400 mt-0.5"></i>
            <span id="userAddress" class="text-gray-700"></span>
          </div>
        </div>
        <div class="flex gap-3 mt-4">
          <button onclick="window.location.href='profile.html'" class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
            <i data-lucide="user" class="w-4 h-4 inline mr-2"></i>View Profile
          </button>
          <button onclick="window.location.href='settings.html'" class="px-4 py-2 border-2 border-gray-300 text-gray-700 rounded-xl font-semibold hover:border-blue-600 hover:text-blue-600 transition-all">
            <i data-lucide="settings" class="w-4 h-4 inline mr-2"></i>Settings
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats Cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-3">
        <div class="p-3 bg-blue-100 rounded-xl">
          <i data-lucide="eye" class="w-6 h-6 text-blue-600"></i>
        </div>
      </div>
      <h3 class="text-2xl font-bold text-gray-900" id="totalViews">0</h3>
      <p class="text-sm text-gray-500 mt-1">Post Views</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-3">
        <div class="p-3 bg-red-100 rounded-xl">
          <i data-lucide="heart" class="w-6 h-6 text-red-500"></i>
        </div>
      </div>
      <h3 class="text-2xl font-bold text-gray-900" id="totalLikes">0</h3>
      <p class="text-sm text-gray-500 mt-1">Total Likes</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-3">
        <div class="p-3 bg-green-100 rounded-xl">
          <i data-lucide="shopping-bag" class="w-6 h-6 text-green-600"></i>
        </div>
      </div>
      <h3 class="text-2xl font-bold text-gray-900" id="totalOrders">0</h3>
      <p class="text-sm text-gray-500 mt-1">Orders</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-3">
        <div class="p-3 bg-purple-100 rounded-xl">
          <i data-lucide="package" class="w-6 h-6 text-purple-600"></i>
        </div>
      </div>
      <h3 class="text-2xl font-bold text-gray-900" id="totalProducts">0</h3>
      <p class="text-sm text-gray-500 mt-1">Products</p>
    </div>
  </div>

  <!-- My Products Section -->
  <div class="bg-white rounded-2xl shadow-lg p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
        <i data-lucide="package" class="w-6 h-6 text-purple-600"></i>
        My Products
      </h2>
      <button onclick="window.location.href='create-product.html'" class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-xl font-semibold hover:shadow-lg transition-all">
        <i data-lucide="plus" class="w-4 h-4"></i>
        Add Product
      </button>
    </div>
    
    <div id="productsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="text-center py-12 text-gray-500 col-span-full">
        <i data-lucide="loader" class="w-12 h-12 mx-auto mb-3 animate-spin"></i>
        <p>Loading products...</p>
      </div>
    </div>
  </div>
</div>

<!-- Edit Product Modal -->
<div id="editProductModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-start mb-4">
      <h3 class="text-xl font-bold text-gray-800">Edit Product</h3>
      <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Product Name</label>
        <input id="editProductName" type="text" 
          class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="Product name" />
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Price (R)</label>
        <input id="editProductPrice" type="number" step="0.01" 
          class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="0.00" />
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
        <select id="editProductCategory" 
          class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="Food">Food & Beverage</option>
          <option value="Tech">Technology</option>
          <option value="Fashion">Fashion</option>
          <option value="Beauty">Beauty</option>
          <option value="Services">Services</option>
          <option value="Other">Other</option>
        </select>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
        <textarea id="editProductDescription" rows="3" 
          class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
          placeholder="Product description"></textarea>
      </div>
      
      <div id="currentImagePreview" class="hidden">
        <label class="block text-sm font-medium text-gray-700 mb-2">Current Image</label>
        <img id="currentProductImage" class="w-full h-32 object-cover rounded-xl" />
      </div>
    </div>
    
    <div class="flex gap-2 mt-6">
      <button onclick="deleteProduct()" 
        class="px-4 py-2 border-2 border-red-600 text-red-600 rounded-xl font-semibold hover:bg-red-50 transition-all">
        <i data-lucide="trash-2" class="w-4 h-4 inline mr-2"></i>Delete
      </button>
      <button onclick="closeEditModal()" 
        class="flex-1 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-xl transition-all">
        Cancel
      </button>
      <button onclick="saveProduct()" id="saveProductBtn"
        class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-xl font-semibold hover:shadow-lg transition-all">
        Save Changes
      </button>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 shadow-lg md:hidden">
  <div class="flex justify-around py-3">
    <a href="feed.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Feed</span>
    </a>
    <a href="search.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="search" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Search</span>
    </a>
    <a href="marketplace.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="shopping-bag" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Market</span>
    </a>
    <a href="inbox.html" class="flex flex-col items-center text-gray-600 relative">
      <i data-lucide="message-circle" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Inbox</span>
      <span id="mobileMessageBadge" class="hidden absolute -top-1 -right-2 bg-green-500 text-white text-xs rounded-full min-w-[18px] h-[18px] flex items-center justify-center font-bold px-1"></span>
    </a>
    <a href="dashboard.html" class="flex flex-col items-center text-blue-600">
      <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Dashboard</span>
    </a>
  </div>
</nav>

<script type="module">
  lucide.createIcons();
  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, getDocs, query, where, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
    authDomain: "online-mall-4422.firebaseapp.com",
    projectId: "online-mall-4422",
    storageBucket: "online-mall-4422.appspot.com"
  });

  const db = getFirestore(app);
  const auth = getAuth(app);

  let currentUser = null;
  let userProfile = null;
  let currentEditProduct = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    
    currentUser = user;
    await loadDashboardData();
  });

  async function loadDashboardData() {
    try {
      await loadUserProfile();
      await loadAnalytics();
      await loadProducts();
      await loadNotificationsBadge();
      await loadMessagesBadge();
    } catch (error) {
      console.error('Error loading dashboard:', error);
    }
  }

  async function loadUserProfile() {
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
      userProfile = userDoc.data();
      setupProfileDisplay();
    }
  }

  function setupProfileDisplay() {
    const displayName = userProfile.businessName || userProfile.name || 'User';
    const initial = displayName.charAt(0).toUpperCase();
    
    document.getElementById('dashboardUserName').textContent = displayName;
    document.getElementById('dashboardUserType').textContent = 
      userProfile.subscriptionType === 'business' ? 'Business Account' : 'Basic Account';
    
    document.getElementById('profileAvatar').textContent = initial;
    document.getElementById('userAvatar').textContent = initial;
    
    document.getElementById('userEmail').textContent = userProfile.email || currentUser.email || 'Not set';
    document.getElementById('userPhone').textContent = userProfile.phone || 'Not set';
    document.getElementById('userLocation').textContent = `${userProfile.city || 'Not set'}, ${userProfile.province || 'Not set'}`;
    document.getElementById('userCategory').textContent = userProfile.category || 'Not set';
    
    if (userProfile.address) {
      document.getElementById('userAddress').textContent = userProfile.address;
      document.getElementById('userAddressContainer').classList.remove('hidden');
    }
    
    lucide.createIcons();
  }

  async function loadAnalytics() {
    try {
      // Posts analytics
      const postsQuery = query(collection(db, "posts"), where("uid", "==", currentUser.uid));
      const postsSnap = await getDocs(postsQuery);
      
      let totalViews = 0;
      let totalLikes = 0;
      
      postsSnap.forEach(postDoc => {
        const post = postDoc.data();
        totalViews += post.views || 0;
        totalLikes += (post.likes || []).length;
      });

      // Orders count
      const ordersQuery = query(collection(db, "marketplace_orders"), where("vendorId", "==", currentUser.uid));
      const ordersSnap = await getDocs(ordersQuery);
      
      // Products count
      const vendorQuery = query(collection(db, "vendors"), where("uid", "==", currentUser.uid));
      const vendorSnap = await getDocs(vendorQuery);
      let totalProducts = 0;
      
      for (const vendorDoc of vendorSnap.docs) {
        const vendorId = vendorDoc.id;
        const productsQuery = query(collection(db, `vendors/${vendorId}/products`));
        const productsSnap = await getDocs(productsQuery);
        totalProducts += productsSnap.size;
      }
      
      document.getElementById('totalViews').textContent = totalViews.toLocaleString();
      document.getElementById('totalLikes').textContent = totalLikes.toLocaleString();
      document.getElementById('totalOrders').textContent = ordersSnap.size.toLocaleString();
      document.getElementById('totalProducts').textContent = totalProducts.toLocaleString();
      
    } catch (error) {
      console.error('Error loading analytics:', error);
    }
  }

  async function loadProducts() {
    try {
      const vendorQuery = query(collection(db, "vendors"), where("uid", "==", currentUser.uid));
      const vendorSnap = await getDocs(vendorQuery);
      
      const productsList = document.getElementById('productsList');
      
      if (vendorSnap.empty) {
        productsList.innerHTML = `
          <div class="text-center py-12 text-gray-500 col-span-full">
            <i data-lucide="package-plus" class="w-16 h-16 mx-auto mb-4 opacity-50 text-purple-400"></i>
            <p class="text-lg font-semibold">No products listed yet</p>
            <p class="text-sm mt-2">Add your first product to the marketplace</p>
            <button onclick="window.location.href='marketplace.html'" class="mt-4 px-6 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
              Add Product
            </button>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let allProducts = [];
      
      for (const vendorDoc of vendorSnap.docs) {
        const vendorId = vendorDoc.id;
        const productsSnap = await getDocs(collection(db, `vendors/${vendorId}/products`));
        
        productsSnap.forEach(productDoc => {
          const product = productDoc.data();
          allProducts.push({ 
            id: productDoc.id, 
            ...product, 
            vendorId: vendorId 
          });
        });
      }

      allProducts.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      if (allProducts.length === 0) {
        productsList.innerHTML = `
          <div class="text-center py-12 text-gray-500 col-span-full">
            <i data-lucide="package-plus" class="w-16 h-16 mx-auto mb-4 opacity-50 text-purple-400"></i>
            <p class="text-lg font-semibold">No products listed yet</p>
            <p class="text-sm mt-2">Add your first product to the marketplace</p>
            <button onclick="window.location.href='marketplace.html'" class="mt-4 px-6 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-semibold hover:shadow-lg transition-all">
              Add Product
            </button>
          </div>
        `;
      } else {
        productsList.innerHTML = allProducts.map(product => `
          <div class="bg-white border-2 border-gray-200 rounded-2xl p-4 hover:shadow-xl transition-all cursor-pointer" onclick="openEditModal('${product.id}', '${product.vendorId}')">
            <div class="w-full h-40 bg-gradient-to-br from-blue-100 to-purple-100 rounded-xl flex items-center justify-center mb-4 overflow-hidden">
              ${product.imageURL ? `<img src="${product.imageURL}" class="w-full h-full object-cover">` : 
                `<i data-lucide="package" class="w-16 h-16 text-purple-400"></i>`}
            </div>
            <h4 class="font-bold text-lg text-gray-900 mb-2 truncate">${product.name || 'Unnamed Product'}</h4>
            <p class="text-purple-600 font-bold text-xl mb-2">R${parseFloat(product.price || 0).toLocaleString()}</p>
            <div class="flex items-center justify-between">
              <span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full font-medium">
                ${product.category || 'Other'}
              </span>
              <button onclick="event.stopPropagation(); openEditModal('${product.id}', '${product.vendorId}')" class="text-blue-600 hover:text-blue-700">
                <i data-lucide="edit-2" class="w-4 h-4"></i>
              </button>
            </div>
            ${product.description ? `<p class="text-sm text-gray-500 mt-3 line-clamp-2">${product.description}</p>` : ''}
          </div>
        `).join('');
      }
      
      lucide.createIcons();
    } catch (error) {
      console.error('Error loading products:', error);
      document.getElementById('productsList').innerHTML = `
        <div class="text-center py-12 text-red-500 col-span-full">
          <p>Error loading products. Please refresh the page.</p>
        </div>
      `;
    }
  }

  async function loadNotificationsBadge() {
    try {
      const notifQuery = query(
        collection(db, "notifications"),
        where("recipientId", "==", currentUser.uid),
        where("read", "==", false)
      );
      const notifSnap = await getDocs(notifQuery);
      const unreadCount = notifSnap.size;
      
      if (unreadCount > 0) {
        const badge = document.getElementById('notifBadge');
        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
        badge.classList.remove('hidden');
      }
    } catch (error) {
      console.error('Error loading notifications:', error);
    }
  }

  async function loadMessagesBadge() {
    try {
      const chatsSnap = await getDocs(collection(db, "chats"));
      let totalUnread = 0;
      
      chatsSnap.forEach(chatDoc => {
        const chatData = chatDoc.data();
        const unreadField = `unread_${currentUser.uid}`;
        if (chatData[unreadField]) {
          totalUnread += chatData[unreadField];
        }
      });
      
      if (totalUnread > 0) {
        const badge = document.getElementById('messageBadge');
        const mobileBadge = document.getElementById('mobileMessageBadge');
        const displayCount = totalUnread > 99 ? '99+' : totalUnread;
        
        badge.textContent = displayCount;
        badge.classList.remove('hidden');
        if (mobileBadge) {
          mobileBadge.textContent = displayCount;
          mobileBadge.classList.remove('hidden');
        }
      }
    } catch (error) {
      console.error('Error loading messages:', error);
    }
  }

  window.openEditModal = async (productId, vendorId) => {
    try {
      const productDoc = await getDoc(doc(db, `vendors/${vendorId}/products`, productId));
      if (!productDoc.exists()) {
        alert('Product not found');
        return;
      }

      const product = productDoc.data();
      currentEditProduct = { id: productId, vendorId, ...product };

      document.getElementById('editProductName').value = product.name || '';
      document.getElementById('editProductPrice').value = product.price || '';
      document.getElementById('editProductCategory').value = product.category || 'Other';
      document.getElementById('editProductDescription').value = product.description || '';

      if (product.imageURL) {
        document.getElementById('currentProductImage').src = product.imageURL;
        document.getElementById('currentImagePreview').classList.remove('hidden');
      } else {
        document.getElementById('currentImagePreview').classList.add('hidden');
      }

      document.getElementById('editProductModal').classList.remove('hidden');
      lucide.createIcons();
    } catch (error) {
      console.error('Error opening edit modal:', error);
      alert('Error loading product details');
    }
  };

  window.closeEditModal = () => {
    document.getElementById('editProductModal').classList.add('hidden');
    currentEditProduct = null;
  };

  window.saveProduct = async () => {
    if (!currentEditProduct) return;

    const name = document.getElementById('editProductName').value.trim();
    const price = parseFloat(document.getElementById('editProductPrice').value);
    const category = document.getElementById('editProductCategory').value;
    const description = document.getElementById('editProductDescription').value.trim();

    if (!name || !price || isNaN(price)) {
      alert('Please fill in all required fields');
      return;
    }

    const saveBtn = document.getElementById('saveProductBtn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin inline"></i> Saving...';
    lucide.createIcons();

    try {
      await updateDoc(doc(db, `vendors/${currentEditProduct.vendorId}/products`, currentEditProduct.id), {
        name,
        price,
        category,
        description
      });

      alert('Product updated successfully!');
      closeEditModal();
      await loadProducts();
      await loadAnalytics();
    } catch (error) {
      console.error('Error updating product:', error);
      alert('Failed to update product. Please try again.');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = 'Save Changes';
      lucide.createIcons();
    }
  };

  window.deleteProduct = async () => {
    if (!currentEditProduct) return;
    
    if (!confirm('Are you sure you want to delete this product? This action cannot be undone.')) return;

    try {
      await deleteDoc(doc(db, `vendors/${currentEditProduct.vendorId}/products`, currentEditProduct.id));
      
      alert('Product deleted successfully!');
      closeEditModal();
      await loadProducts();
      await loadAnalytics();
    } catch (error) {
      console.error('Error deleting product:', error);
      alert('Failed to delete product. Please try again.');
    }
  };
</script>

</body>
</html>
