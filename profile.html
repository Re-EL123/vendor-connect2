<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - Street Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .star-rating {
      display: inline-flex;
      gap: 4px;
    }
    .star {
      cursor: pointer;
      transition: all 0.2s;
    }
    .star:hover {
      transform: scale(1.2);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="window.history.back()" class="flex items-center gap-2 text-gray-600 hover:text-gray-800">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span class="font-semibold">Back</span>
      </button>
      <h1 class="text-xl font-bold text-gray-800">Profile</h1>
      <div class="w-20"></div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-6">
    
    <!-- Profile Header -->
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden mb-6">
      <div class="h-32 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
      <div class="px-6 pb-6">
        <div class="flex items-end justify-between -mt-16 mb-4">
          <img id="profileAvatar" src="https://via.placeholder.com/128" alt="Profile"
            class="w-32 h-32 rounded-full border-4 border-white shadow-lg object-cover">
          <div id="actionButtons" class="flex gap-2 mb-2"></div>
        </div>
        
        <div>
          <h1 id="profileName" class="text-2xl font-bold text-gray-800 mb-1">Loading...</h1>
          <p id="profileCategory" class="text-gray-600 mb-2"></p>
          <p id="profileBio" class="text-gray-700 mb-3"></p>
          
          <div class="flex flex-wrap gap-4 text-sm text-gray-600">
            <div class="flex items-center gap-1">
              <i data-lucide="map-pin" class="w-4 h-4"></i>
              <span id="profileLocation">—</span>
            </div>
            <div class="flex items-center gap-1">
              <i data-lucide="calendar" class="w-4 h-4"></i>
              <span id="profileJoined">—</span>
            </div>
            <div id="profileContact" class="flex items-center gap-1"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
      
      <!-- Stats Sidebar -->
      <aside class="md:col-span-1 space-y-6">
        <div class="bg-white rounded-2xl shadow-lg p-6">
          <h3 class="font-bold text-gray-800 mb-4">Stats</h3>
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-gray-600">Posts</span>
              <span id="statPosts" class="font-bold text-blue-600">0</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-gray-600">Followers</span>
              <span id="statFollowers" class="font-bold text-purple-600">0</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-gray-600">Likes</span>
              <span id="statLikes" class="font-bold text-pink-600">0</span>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-gray-600">Views</span>
              <span id="statViews" class="font-bold text-green-600">0</span>
            </div>
          </div>
        </div>
        
        <!-- Rating Section for Vendors -->
        <div id="ratingSection" class="hidden bg-white rounded-2xl shadow-lg p-6">
          <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i data-lucide="star" class="w-5 h-5 text-yellow-500"></i>
            Rating
          </h3>
          
          <div class="text-center mb-4">
            <div class="text-4xl font-bold text-gray-800 mb-1">
              <span id="avgRating">0.0</span>
            </div>
            <div id="avgStars" class="star-rating justify-center mb-2"></div>
            <p class="text-sm text-gray-500">
              <span id="ratingCount">0</span> ratings
            </p>
          </div>
          
          <div id="rateVendorSection" class="hidden pt-4 border-t border-gray-100">
            <p class="text-sm font-semibold text-gray-700 mb-2">Rate this vendor</p>
            <div id="userRatingStars" class="star-rating justify-center mb-3"></div>
            <button onclick="submitRating()" id="submitRatingBtn"
              class="w-full bg-gradient-to-r from-yellow-500 to-orange-500 text-white py-2 rounded-lg font-semibold hover:shadow-lg transition-all">
              Submit Rating
            </button>
          </div>
        </div>
        
        <div id="catalogSection" class="hidden bg-white rounded-2xl shadow-lg p-6">
          <h3 class="font-bold text-gray-800 mb-4">Catalog</h3>
          <div id="catalogItems" class="space-y-3">
            <p class="text-sm text-gray-500">No products yet</p>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="md:col-span-2">
        <!-- Tabs -->
        <div class="bg-white rounded-2xl shadow-lg mb-6">
          <div class="border-b border-gray-200">
            <nav class="flex">
              <button onclick="switchTab('posts')" data-tab="posts" 
                class="tab-btn border-b-2 border-blue-600 text-blue-600 px-6 py-4 font-semibold">
                Posts
              </button>
              <button onclick="switchTab('media')" data-tab="media" 
                class="tab-btn border-b-2 border-transparent text-gray-600 hover:text-gray-800 px-6 py-4 font-semibold">
                Media
              </button>
            </nav>
          </div>

          <!-- Tab Content -->
          <div class="p-6">
            <!-- Posts Tab -->
            <div id="postsTab" class="tab-content">
              <div id="postsList" class="space-y-4">
                <p class="text-center text-gray-500 py-8">Loading posts...</p>
              </div>
            </div>

            <!-- Media Tab -->
            <div id="mediaTab" class="tab-content hidden">
              <div id="mediaGrid" class="grid grid-cols-3 gap-3">
                <p class="col-span-3 text-center text-gray-500 py-8">Loading media...</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    lucide.createIcons();
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
      authDomain: "online-mall-4422.firebaseapp.com",
      projectId: "online-mall-4422",
      storageBucket: "online-mall-4422.appspot.com"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);
    
    const urlParams = new URLSearchParams(window.location.search);
    const profileUid = urlParams.get("uid");
    
    let currentUser = null;
    let profileData = null;
    let userPosts = [];
    let isOwnProfile = false;
    let isFollowing = false;
    let userRating = 0;
    let allRatings = [];

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      isOwnProfile = !profileUid || profileUid === currentUser.uid;
      
      await loadProfile();
      await loadPosts();
      await loadStats();
      await loadRatings();
    });

    async function loadProfile() {
      const uid = profileUid || currentUser.uid;
      const userDoc = await getDoc(doc(db, "users", uid));
      
      if (!userDoc.exists()) {
        alert("User not found");
        window.location.href = "feed.html";
        return;
      }
      
      profileData = { uid, ...userDoc.data() };
      
      const name = profileData.businessName || profileData.name || "User";
      const profileImage = profileData.profileImage || `https://via.placeholder.com/128?text=${encodeURIComponent(name.charAt(0).toUpperCase())}`;
      
      document.getElementById('profileName').textContent = name;
      document.getElementById('profileAvatar').src = profileImage;
      
      if (profileData.category) {
        document.getElementById('profileCategory').textContent = profileData.category;
      }
      
      if (profileData.businessDescription) {
        document.getElementById('profileBio').textContent = profileData.businessDescription;
      }
      
      if (profileData.city && profileData.province) {
        document.getElementById('profileLocation').textContent = `${profileData.city}, ${profileData.province}`;
      }
      
      if (profileData.createdAt) {
        const date = new Date(profileData.createdAt.seconds * 1000);
        document.getElementById('profileJoined').textContent = `Joined ${date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}`;
      }
      
      if (profileData.phone) {
        document.getElementById('profileContact').innerHTML = `
          <i data-lucide="phone" class="w-4 h-4"></i>
          <span>${profileData.phone}</span>
        `;
      }
      
      const actionButtons = document.getElementById('actionButtons');
      
      if (isOwnProfile) {
        actionButtons.innerHTML = `
          <button onclick="window.location.href='settings.html'" 
            class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors flex items-center gap-2">
            <i data-lucide="settings" class="w-4 h-4"></i>
            Edit Profile
          </button>
        `;
      } else {
        const followDoc = await getDoc(doc(db, "follows", `${currentUser.uid}_${uid}`));
        isFollowing = followDoc.exists();
        
        actionButtons.innerHTML = `
          <button onclick="toggleFollow()" id="followBtn"
            class="px-4 py-2 ${isFollowing ? 'bg-gray-200 text-gray-800' : 'bg-blue-600 text-white'} rounded-lg hover:opacity-90 transition-colors flex items-center gap-2">
            <i data-lucide="${isFollowing ? 'user-check' : 'user-plus'}" class="w-4 h-4"></i>
            ${isFollowing ? 'Following' : 'Follow'}
          </button>
          <button onclick="messageUser()" 
            class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors flex items-center gap-2">
            <i data-lucide="message-circle" class="w-4 h-4"></i>
            Message
          </button>
        `;
      }
      
      if (profileData.isVendor) {
        document.getElementById('catalogSection').classList.remove('hidden');
        await loadCatalog(uid);
      }
      
      lucide.createIcons();
    }

    async function loadRatings() {
      const uid = profileUid || currentUser.uid;
      
      if (!profileData.isVendor) return;
      
      document.getElementById('ratingSection').classList.remove('hidden');
      
      const ratingsQuery = query(collection(db, "ratings"));
      const ratingsSnap = await getDocs(ratingsQuery);
      
      allRatings = [];
      let userHasRated = false;
      let userRatingValue = 0;
      
      ratingsSnap.forEach(ratingDoc => {
        const rating = ratingDoc.data();
        const docId = ratingDoc.id;
        
        if (docId.endsWith(`_${uid}`)) {
          allRatings.push(rating);
          
          if (docId === `${currentUser.uid}_${uid}`) {
            userHasRated = true;
            userRatingValue = rating.value || 0;
          }
        }
      });
      
      const avgRating = allRatings.length > 0 
        ? (allRatings.reduce((sum, r) => sum + (r.value || 0), 0) / allRatings.length).toFixed(1)
        : '0.0';
      
      document.getElementById('avgRating').textContent = avgRating;
      document.getElementById('ratingCount').textContent = allRatings.length;
      
      renderStars('avgStars', parseFloat(avgRating), false);
      
      if (!isOwnProfile) {
        document.getElementById('rateVendorSection').classList.remove('hidden');
        userRating = userHasRated ? userRatingValue : 0;
        renderStars('userRatingStars', userRating, true);
      }
      
      lucide.createIcons();
    }

    function renderStars(containerId, rating, interactive) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('i');
        star.setAttribute('data-lucide', 'star');
        star.className = `star w-6 h-6 ${i <= rating ? 'text-yellow-500 fill-current' : 'text-gray-300'}`;
        
        if (interactive) {
          star.onclick = () => {
            userRating = i;
            renderStars(containerId, i, true);
          };
        }
        
        container.appendChild(star);
      }
      
      lucide.createIcons();
    }

    window.submitRating = async () => {
      if (userRating === 0) {
        alert('Please select a rating');
        return;
      }
      
      const uid = profileUid || currentUser.uid;
      const ratingId = `${currentUser.uid}_${uid}`;
      
      try {
        await setDoc(doc(db, "ratings", ratingId), {
          uid: currentUser.uid,
          value: userRating,
          timestamp: serverTimestamp()
        });
        
        alert('Rating submitted successfully!');
        await loadRatings();
      } catch (error) {
        console.error('Error submitting rating:', error);
        alert('Failed to submit rating');
      }
    };

    async function loadPosts() {
      const uid = profileUid || currentUser.uid;
      const postsQuery = query(collection(db, "posts"), where("uid", "==", uid));
      const postsSnap = await getDocs(postsQuery);
      
      userPosts = [];
      for (const postDoc of postsSnap.docs) {
        const post = { id: postDoc.id, ...postDoc.data() };
        userPosts.push(post);
      }
      
      userPosts.sort((a, b) => b.createdAt?.seconds - a.createdAt?.seconds);
      
      renderPosts();
      renderMedia();
    }

    function renderPosts() {
      const container = document.getElementById('postsList');
      
      if (userPosts.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="file-text" class="w-8 h-8 text-gray-400"></i>
            </div>
            <p class="text-gray-600">${isOwnProfile ? 'You haven\'t' : 'This user hasn\'t'} created any posts yet</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }
      
      container.innerHTML = '';
      
      userPosts.forEach(post => {
        const postCard = document.createElement('div');
        postCard.className = 'bg-gray-50 rounded-xl p-4 hover:bg-gray-100 transition-colors cursor-pointer';
        postCard.onclick = () => window.location.href = `post-details.html?id=${post.id}`;
        
        postCard.innerHTML = `
          ${post.imageURL ? `<img src="${post.imageURL}" class="w-full h-48 object-cover rounded-lg mb-3" />` : ''}
          <p class="text-gray-700 mb-3">${post.description || post.title || ''}</p>
          <div class="flex items-center gap-4 text-sm text-gray-600">
            <span class="flex items-center gap-1">
              <i data-lucide="heart" class="w-4 h-4"></i>
              ${(post.likes || []).length}
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="message-circle" class="w-4 h-4"></i>
              ${post.commentsCount || 0}
            </span>
            <span class="flex items-center gap-1">
              <i data-lucide="eye" class="w-4 h-4"></i>
              ${post.views || 0}
            </span>
            <span class="text-xs text-gray-500 ml-auto">
              ${new Date(post.createdAt?.seconds * 1000).toLocaleDateString()}
            </span>
          </div>
        `;
        
        container.appendChild(postCard);
      });
      
      lucide.createIcons();
    }

    function renderMedia() {
      const container = document.getElementById('mediaGrid');
      const mediaPosts = userPosts.filter(p => p.imageURL);
      
      if (mediaPosts.length === 0) {
        container.innerHTML = `
          <div class="col-span-3 text-center py-12">
            <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="image" class="w-8 h-8 text-gray-400"></i>
            </div>
            <p class="text-gray-600">No media posts</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }
      
      container.innerHTML = '';
      
      mediaPosts.forEach(post => {
        const mediaItem = document.createElement('div');
        mediaItem.className = 'aspect-square rounded-lg overflow-hidden cursor-pointer hover:opacity-80 transition-opacity';
        mediaItem.onclick = () => window.location.href = `post-details.html?id=${post.id}`;
        
        mediaItem.innerHTML = `
          <img src="${post.imageURL}" class="w-full h-full object-cover" />
        `;
        
        container.appendChild(mediaItem);
      });
    }

    async function loadStats() {
      const uid = profileUid || currentUser.uid;
      
      document.getElementById('statPosts').textContent = userPosts.length;
      
      const followersQuery = query(collection(db, "follows"), where("vendorId", "==", uid));
      const followersSnap = await getDocs(followersQuery);
      document.getElementById('statFollowers').textContent = followersSnap.size;
      
      const totalLikes = userPosts.reduce((sum, p) => sum + ((p.likes || []).length), 0);
      document.getElementById('statLikes').textContent = totalLikes;
      
      const totalViews = userPosts.reduce((sum, p) => sum + (p.views || 0), 0);
      document.getElementById('statViews').textContent = totalViews;
    }

    async function loadCatalog(uid) {
      const vendorDoc = await getDoc(doc(db, "vendors", uid));
      
      if (!vendorDoc.exists()) return;
      
      const productsQuery = query(collection(db, `vendors/${uid}/products`));
      const productsSnap = await getDocs(productsQuery);
      
      const container = document.getElementById('catalogItems');
      
      if (productsSnap.empty) {
        container.innerHTML = '<p class="text-sm text-gray-500">No products yet</p>';
        return;
      }
      
      container.innerHTML = '';
      
      productsSnap.docs.slice(0, 5).forEach(prodDoc => {
        const product = prodDoc.data();
        const item = document.createElement('div');
        item.className = 'flex items-center gap-3 p-2 hover:bg-gray-50 rounded-lg cursor-pointer';
        item.onclick = () => window.location.href = `marketplace.html?vendor=${uid}`;
        
        item.innerHTML = `
          ${product.imageURL ? 
            `<img src="${product.imageURL}" class="w-12 h-12 rounded-lg object-cover" />` :
            `<div class="w-12 h-12 bg-gray-200 rounded-lg"></div>`
          }
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-800 truncate">${product.name}</p>
            <p class="text-xs text-gray-600">R${product.price}</p>
          </div>
        `;
        
        container.appendChild(item);
      });
    }

    window.messageUser = async () => {
      const uid = profileUid || currentUser.uid;
      
      if (!uid || uid === currentUser.uid) {
        alert('Cannot message yourself');
        return;
      }
      
      try {
        const participant1 = currentUser.uid < uid ? currentUser.uid : uid;
        const participant2 = currentUser.uid < uid ? uid : currentUser.uid;
        const chatId = `${participant1}_${participant2}`;
        
        const chatDoc = await getDoc(doc(db, "chats", chatId));
        
        if (!chatDoc.exists()) {
          await setDoc(doc(db, "chats", chatId), {
            participants: [currentUser.uid, uid],
            participant1: participant1,
            participant2: participant2,
            lastMessage: '',
            lastMessageTime: serverTimestamp(),
            [`unread_${currentUser.uid}`]: 0,
            [`unread_${uid}`]: 0
          });
        }
        
        window.location.href = `chat.html?chatId=${chatId}&uid=${uid}`;
      } catch (error) {
        console.error('Error creating chat:', error);
        alert('Failed to start chat');
      }
    };

    window.toggleFollow = async () => {
      const uid = profileUid || currentUser.uid;
      const followId = `${currentUser.uid}_${uid}`;
      
      try {
        if (isFollowing) {
          await deleteDoc(doc(db, "follows", followId));
          isFollowing = false;
        } else {
          await setDoc(doc(db, "follows", followId), {
            uid: currentUser.uid,
            vendorId: uid,
            timestamp: serverTimestamp()
          });
          isFollowing = true;
        }
        
        await loadProfile();
        await loadStats();
      } catch (error) {
        console.error('Error toggling follow:', error);
        alert('Failed to update follow status');
      }
    };

    window.switchTab = function(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-blue-600', 'text-blue-600');
        btn.classList.add('border-transparent', 'text-gray-600');
      });
      document.querySelector(`[data-tab="${tabName}"]`).classList.remove('border-transparent', 'text-gray-600');
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('border-blue-600', 'text-blue-600');
      
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.add('hidden');
      });
      document.getElementById(`${tabName}Tab`).classList.remove('hidden');
    };
  </script>

</body>
</html>
