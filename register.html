<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join VendorConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-in { animation: slideIn 0.5s ease-out; }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl p-8 animate-slide-in">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">VendorConnect</h1>
      <p class="text-sm text-gray-600 mt-2">Connect, Grow, Succeed</p>
    </div>

    <!-- Progress Bar -->
    <div class="mb-8">
      <div class="flex justify-between mb-2">
        <span id="progressText" class="text-xs font-medium text-gray-600">Step 1 of 4</span>
        <span class="text-xs text-gray-500">Almost there!</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2">
        <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-purple-500 h-2 rounded-full transition-all duration-500" style="width: 25%"></div>
      </div>
    </div>

    <!-- Form -->
    <form id="registerForm" class="space-y-6">
      
      <!-- STEP 1: Account Type -->
      <div class="step">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="user-circle" class="w-6 h-6 text-blue-600"></i>
          Choose Your Account Type
        </h2>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
          <button type="button" onclick="selectAccountType('basic')" 
            class="account-type-btn p-6 border-2 border-gray-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-all text-center"
            data-type="basic">
            <i data-lucide="user" class="w-12 h-12 mx-auto mb-2 text-blue-600"></i>
            <h3 class="font-bold text-gray-800">Basic</h3>
            <p class="text-xs text-gray-500 mt-1">Browse and discover</p>
          </button>
          
          <button type="button" onclick="selectAccountType('business')" 
            class="account-type-btn p-6 border-2 border-gray-200 rounded-xl hover:border-purple-500 hover:bg-purple-50 transition-all text-center"
            data-type="business">
            <i data-lucide="briefcase" class="w-12 h-12 mx-auto mb-2 text-purple-600"></i>
            <h3 class="font-bold text-gray-800">Business</h3>
            <p class="text-xs text-gray-500 mt-1">Sell and promote</p>
          </button>
        </div>
        
        <button type="button" onclick="nextStep()" id="step1Next" disabled
          class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-lg transition-all flex items-center justify-center gap-2">
          Continue <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- STEP 2: Personal Info -->
      <div class="step hidden">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="user" class="w-6 h-6 text-blue-600"></i>
          Personal Information
        </h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input type="text" id="name" required
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="John Doe" />
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="email" required
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="john@example.com" />
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
            <input type="tel" id="phone" required
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="0812345678" />
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" required minlength="6"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Minimum 6 characters" />
          </div>
        </div>
        
        <div class="flex gap-3 mt-6">
          <button type="button" onclick="prevStep()" 
            class="flex-1 border-2 border-gray-300 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Back
          </button>
          <button type="button" onclick="nextStep()"
            class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2">
            Continue <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- STEP 3: Location -->
      <div class="step hidden">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="map-pin" class="w-6 h-6 text-blue-600"></i>
          Location
        </h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Province</label>
            <select id="province" required onchange="updateCities()"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Select Province</option>
              <option value="Gauteng">Gauteng</option>
              <option value="Western Cape">Western Cape</option>
              <option value="KwaZulu-Natal">KwaZulu-Natal</option>
              <option value="Eastern Cape">Eastern Cape</option>
              <option value="Free State">Free State</option>
              <option value="Limpopo">Limpopo</option>
              <option value="Mpumalanga">Mpumalanga</option>
              <option value="North West">North West</option>
              <option value="Northern Cape">Northern Cape</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
            <select id="city" required
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Select Province First</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Address (Optional)</label>
            <input type="text" id="address"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Street address or area" />
          </div>
        </div>
        
        <div class="flex gap-3 mt-6">
          <button type="button" onclick="prevStep()" 
            class="flex-1 border-2 border-gray-300 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Back
          </button>
          <button type="button" onclick="nextStep()"
            class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2">
            Continue <i data-lucide="arrow-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- STEP 4: Business Info (Conditional) -->
      <div class="step hidden">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
          <i data-lucide="briefcase" class="w-6 h-6 text-purple-600"></i>
          Business Information
        </h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Business Name</label>
            <input type="text" id="businessName"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="Your Business Name" />
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Business Category</label>
            <select id="category"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent">
              <option value="">Select Category</option>
              <option value="Food">Food & Beverage</option>
              <option value="Tech">Technology & Software</option>
              <option value="Fashion">Fashion & Apparel</option>
              <option value="Beauty">Beauty & Wellness</option>
              <option value="Home">Home & Garden</option>
              <option value="Services">Professional Services</option>
              <option value="Health">Health & Fitness</option>
              <option value="Education">Education & Training</option>
              <option value="Entertainment">Entertainment & Events</option>
              <option value="Automotive">Automotive</option>
              <option value="Construction">Construction & Trades</option>
              <option value="Other">Other</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Business Description</label>
            <textarea id="businessDescription" rows="3"
              class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent"
              placeholder="Tell us about your business..."></textarea>
          </div>
        </div>
        
        <div class="flex gap-3 mt-6">
          <button type="button" onclick="prevStep()" 
            class="flex-1 border-2 border-gray-300 text-gray-700 py-3 rounded-xl font-semibold hover:bg-gray-50 transition-all flex items-center justify-center gap-2">
            <i data-lucide="arrow-left" class="w-5 h-5"></i> Back
          </button>
          <button type="submit" id="submitBtn"
            class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-xl font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2">
            <i data-lucide="check-circle" class="w-5 h-5"></i> Create Account
          </button>
        </div>
      </div>

    </form>

    <p id="error" class="text-red-500 mt-4 text-sm text-center"></p>

    <p class="text-sm text-center mt-6 text-gray-600">
      Already have an account?
      <a href="login.html" class="text-blue-600 hover:underline font-semibold">Login</a>
    </p>
    
    <p class="text-xs text-center mt-4 text-gray-500">
      By continuing, you agree to our <a href="terms.html" class="text-blue-600 hover:underline">Terms</a> and <a href="privacy.html" class="text-blue-600 hover:underline">Privacy Policy</a>
    </p>
  </div>

  <script type="module">
    lucide.createIcons();
    
    const citiesByProvince = {
      "Gauteng": ["Johannesburg", "Pretoria", "Soweto", "Sandton", "Midrand", "Centurion", "Randburg", "Roodepoort", "Benoni", "Boksburg"],
      "Western Cape": ["Cape Town", "Stellenbosch", "Paarl", "George", "Somerset West", "Bellville", "Worcester", "Hermanus", "Mossel Bay"],
      "KwaZulu-Natal": ["Durban", "Pietermaritzburg", "Newcastle", "Richards Bay", "Ladysmith", "Empangeni", "Port Shepstone", "Pinetown"],
      "Eastern Cape": ["Port Elizabeth", "East London", "Mthatha", "Uitenhage", "Grahamstown", "King William's Town", "Queenstown", "Butterworth"],
      "Free State": ["Bloemfontein", "Welkom", "Kroonstad", "Bethlehem", "Sasolburg", "Phuthaditjhaba", "Virginia", "Parys"],
      "Limpopo": ["Polokwane", "Tzaneen", "Thohoyandou", "Phalaborwa", "Musina", "Mokopane", "Lebowakgomo", "Bela-Bela"],
      "Mpumalanga": ["Nelspruit", "Witbank", "Middelburg", "Secunda", "Ermelo", "Standerton", "Barberton", "White River"],
      "North West": ["Rustenburg", "Mahikeng", "Klerksdorp", "Potchefstroom", "Brits", "Vryburg", "Lichtenburg", "Mmabatho"],
      "Northern Cape": ["Kimberley", "Upington", "Kuruman", "De Aar", "Springbok", "Postmasburg", "Prieska", "Colesberg"]
    };
    
    window.updateCities = function() {
      const province = document.getElementById('province').value;
      const citySelect = document.getElementById('city');
      
      citySelect.innerHTML = '<option value="">Select City</option>';
      
      if (province && citiesByProvince[province]) {
        citiesByProvince[province].forEach(city => {
          const option = document.createElement('option');
          option.value = city;
          option.textContent = city;
          citySelect.appendChild(option);
        });
      }
    };
    
    const steps = document.querySelectorAll(".step");
    let currentStep = 0;
    let selectedAccountType = '';

    window.selectAccountType = function(type) {
      selectedAccountType = type;
      document.querySelectorAll('.account-type-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-50', 'border-purple-500', 'bg-purple-50');
      });
      const btn = document.querySelector(`[data-type="${type}"]`);
      if (type === 'basic') {
        btn.classList.add('border-blue-500', 'bg-blue-50');
      } else {
        btn.classList.add('border-purple-500', 'bg-purple-50');
      }
      document.getElementById('step1Next').disabled = false;
    };

    window.nextStep = function() {
      // Skip business step if account type is basic
      if (currentStep === 2 && selectedAccountType === 'basic') {
        currentStep = 3;
      }
      
      steps[currentStep].classList.add("hidden");
      currentStep++;
      steps[currentStep].classList.remove("hidden");
      
      // Update progress
      const progress = ((currentStep + 1) / 4) * 100;
      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('progressText').textContent = `Step ${currentStep + 1} of 4`;
      
      lucide.createIcons();
    };

    window.prevStep = function() {
      // Skip business step when going back if account type is basic
      if (currentStep === 3 && selectedAccountType === 'basic') {
        currentStep = 2;
      }
      
      steps[currentStep].classList.add("hidden");
      currentStep--;
      steps[currentStep].classList.remove("hidden");
      
      // Update progress
      const progress = ((currentStep + 1) / 4) * 100;
      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('progressText').textContent = `Step ${currentStep + 1} of 4`;
      
      lucide.createIcons();
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
      authDomain: "online-mall-4422.firebaseapp.com",
      databaseURL: "https://online-mall-4422-default-rtdb.firebaseio.com",
      projectId: "online-mall-4422",
      storageBucket: "online-mall-4422.appspot.com",
      messagingSenderId: "947082232783",
      appId: "1:947082232783:web:116206502e5fb38383c8ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const registerForm = document.getElementById("registerForm");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Creating Account...';
      lucide.createIcons();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const province = document.getElementById("province").value;
      const city = document.getElementById("city").value;
      const address = document.getElementById("address").value.trim();

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        const userData = {
          uid,
          name,
          email,
          phone,
          province,
          city,
          address,
          role: "basic",
          subscriptionType: selectedAccountType,
          isVendor: selectedAccountType === 'business',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        };

        if (selectedAccountType === 'business') {
          userData.businessName = document.getElementById("businessName").value.trim();
          userData.category = document.getElementById("category").value;
          userData.businessDescription = document.getElementById("businessDescription").value.trim();
        }

        await setDoc(doc(db, "users", uid), userData);

        if (selectedAccountType === 'business') {
          await setDoc(doc(db, "vendors", uid), {
            uid,
            name: userData.businessName,
            description: userData.businessDescription,
            category: userData.category,
            email,
            phone,
            imageURL: "",
            isApproved: false,
            subscriptionStatus: "pending",
            createdAt: serverTimestamp()
          });
        }

        window.location.href = "feed.html";
      } catch (err) {
        errorEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> Create Account';
        lucide.createIcons();
      }
    });
  </script>

</body>
</html>
