<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search - VendorConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <button onclick="window.history.back()" class="text-gray-600 hover:text-gray-800">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </button>
      
      <div class="flex-1 relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input type="text" id="searchInput" placeholder="Search businesses, categories..." 
          class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-6">
    
    <!-- Filters -->
    <div class="bg-white rounded-2xl shadow-lg p-4 mb-6">
      <div class="flex flex-wrap gap-3">
        <select id="categoryFilter" class="px-4 py-2 border border-gray-300 rounded-xl">
          <option value="">All Categories</option>
          <option value="Food">Food & Beverage</option>
          <option value="Tech">Technology</option>
          <option value="Fashion">Fashion</option>
          <option value="Beauty">Beauty & Wellness</option>
          <option value="Services">Professional Services</option>
          <option value="Other">Other</option>
        </select>
        
        <select id="provinceFilter" class="px-4 py-2 border border-gray-300 rounded-xl">
          <option value="">All Provinces</option>
          <option value="Gauteng">Gauteng</option>
          <option value="Western Cape">Western Cape</option>
          <option value="KwaZulu-Natal">KwaZulu-Natal</option>
          <option value="Eastern Cape">Eastern Cape</option>
          <option value="Free State">Free State</option>
          <option value="Limpopo">Limpopo</option>
          <option value="Mpumalanga">Mpumalanga</option>
          <option value="North West">North West</option>
          <option value="Northern Cape">Northern Cape</option>
        </select>
      </div>
    </div>

    <!-- Results -->
    <div id="resultsContainer" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12">
        <p class="text-gray-500">Loading businesses...</p>
      </div>
    </div>
  </div>

  <script type="module">
    lucide.createIcons();
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
      authDomain: "online-mall-4422.firebaseapp.com",
      projectId: "online-mall-4422"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let allVendors = [];
    let currentUser = null;

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      await loadVendors();
    });

    async function loadVendors() {
      const vendorsQuery = query(collection(db, "vendors"), where("isApproved", "==", true));
      const snap = await getDocs(vendorsQuery);
      allVendors = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderVendors(allVendors);
    }

    function renderVendors(vendors) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';
      
      if (vendors.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="search-x" class="w-10 h-10 text-gray-400"></i>
            </div>
            <p class="text-gray-600">No businesses found</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }
      
      vendors.forEach(vendor => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition-shadow cursor-pointer';
        card.onclick = () => window.location.href = `profile.html?uid=${vendor.uid}`;
        
        card.innerHTML = `
          <div class="h-40 bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
            ${vendor.imageURL ? 
              `<img src="${vendor.imageURL}" class="w-full h-full object-cover" />` :
              `<div class="text-white text-6xl font-bold">${vendor.name.charAt(0).toUpperCase()}</div>`
            }
          </div>
          <div class="p-6">
            <h3 class="font-bold text-lg text-gray-800 mb-2">${vendor.name}</h3>
            <p class="text-sm text-gray-600 mb-3 line-clamp-2">${vendor.description || 'No description'}</p>
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
              <i data-lucide="tag" class="w-4 h-4"></i>
              <span>${vendor.category}</span>
            </div>
            <div class="flex gap-2">
              <button onclick="event.stopPropagation(); window.location.href='chat.html?uid=${vendor.uid}'" 
                class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                <i data-lucide="message-circle" class="w-4 h-4"></i>
                Message
              </button>
              <button onclick="event.stopPropagation(); window.location.href='profile.html?uid=${vendor.uid}'" 
                class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
      
      lucide.createIcons();
    }

    // Search and filters
    document.getElementById('searchInput').addEventListener('input', filterVendors);
    document.getElementById('categoryFilter').addEventListener('change', filterVendors);
    document.getElementById('provinceFilter').addEventListener('change', filterVendors);

    function filterVendors() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const province = document.getElementById('provinceFilter').value;
      
      const filtered = allVendors.filter(v => {
        const matchesSearch = !searchTerm || 
          v.name.toLowerCase().includes(searchTerm) ||
          v.description?.toLowerCase().includes(searchTerm) ||
          v.category.toLowerCase().includes(searchTerm);
        const matchesCategory = !category || v.category === category;
        const matchesProvince = !province || v.province === province;
        
        return matchesSearch && matchesCategory && matchesProvince;
      });
      
      renderVendors(filtered);
    }
  </script>

</body>
</html>
