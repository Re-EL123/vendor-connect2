<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search - VendorConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <button onclick="window.history.back()" class="text-gray-600 hover:text-gray-800">
        <i data-lucide="arrow-left" class="w-6 h-6"></i>
      </button>
      
      <div class="flex-1 relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"></i>
        <input type="text" id="searchInput" placeholder="Search businesses, categories..." 
          class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-6">
    
    <!-- Filters -->
    <div class="bg-white rounded-2xl shadow-lg p-4 mb-6">
      <div class="flex flex-wrap gap-3">
        <select id="categoryFilter" class="px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="">All Categories</option>
          <option value="Food">Food & Beverage</option>
          <option value="Tech">Technology</option>
          <option value="Fashion">Fashion</option>
          <option value="Beauty">Beauty & Wellness</option>
          <option value="Services">Professional Services</option>
          <option value="Other">Other</option>
        </select>
        
        <select id="provinceFilter" class="px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="">All Provinces</option>
          <option value="Gauteng">Gauteng</option>
          <option value="Western Cape">Western Cape</option>
          <option value="KwaZulu-Natal">KwaZulu-Natal</option>
          <option value="Eastern Cape">Eastern Cape</option>
          <option value="Free State">Free State</option>
          <option value="Limpopo">Limpopo</option>
          <option value="Mpumalanga">Mpumalanga</option>
          <option value="North West">North West</option>
          <option value="Northern Cape">Northern Cape</option>
        </select>
        
        <select id="sortFilter" class="px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          <option value="name">Sort by Name</option>
          <option value="newest">Newest First</option>
          <option value="category">By Category</option>
        </select>
      </div>
    </div>

    <!-- Results -->
    <div id="resultsContainer" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-12">
        <i data-lucide="loader" class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3"></i>
        <p class="text-gray-500">Loading businesses...</p>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 shadow-lg md:hidden">
    <div class="flex justify-around py-3">
      <a href="feed.html" class="flex flex-col items-center text-gray-600">
        <i data-lucide="home" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Feed</span>
      </a>
      <a href="search.html" class="flex flex-col items-center text-blue-600">
        <i data-lucide="search" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Search</span>
      </a>
      <a href="marketplace.html" class="flex flex-col items-center text-gray-600">
        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Market</span>
      </a>
      <a href="inbox.html" class="flex flex-col items-center text-gray-600">
        <i data-lucide="message-circle" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Inbox</span>
      </a>
      <a href="profile.html" class="flex flex-col items-center text-gray-600">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-xs font-medium mt-1">Profile</span>
      </a>
    </div>
  </nav>

  <script type="module">
    lucide.createIcons();
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
      authDomain: "online-mall-4422.firebaseapp.com",
      projectId: "online-mall-4422",
      storageBucket: "online-mall-4422.appspot.com"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let allBusinesses = [];
    let currentUser = null;

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      await loadBusinesses();
    });

    async function loadBusinesses() {
      try {
        // Fetch all users
        const usersSnap = await getDocs(collection(db, "users"));
        const businesses = [];
        
        usersSnap.forEach(userDoc => {
          const userData = { id: userDoc.id, ...userDoc.data() };
          
          // Only include business/premium accounts that are not the current user
          if ((userData.subscriptionType === 'business' || userData.subscriptionType === 'premium') 
              && userDoc.id !== currentUser.uid) {
            businesses.push(userData);
          }
        });
        
        // Sort by name by default - client-side sorting
        allBusinesses = businesses.sort((a, b) => {
          const nameA = (a.businessName || a.name || '').toLowerCase();
          const nameB = (b.businessName || b.name || '').toLowerCase();
          return nameA.localeCompare(nameB);
        });
        
        renderBusinesses(allBusinesses);
      } catch (error) {
        console.error('Error loading businesses:', error);
        const container = document.getElementById('resultsContainer');
        container.innerHTML = `
          <div class="col-span-full text-center py-16">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="alert-circle" class="w-10 h-10 text-red-600"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Error loading businesses</h3>
            <p class="text-gray-600 mb-4">Please try refreshing the page</p>
            <button onclick="location.reload()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              Refresh
            </button>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function renderBusinesses(businesses) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';
      
      if (businesses.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 fade-in">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="search-x" class="w-10 h-10 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-2">No businesses found</h3>
            <p class="text-gray-600">Try adjusting your search or filters</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }
      
      businesses.forEach(business => {
        const displayName = business.businessName || business.name || 'Unknown Business';
        const initial = displayName.charAt(0).toUpperCase();
        
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-xl transition-shadow cursor-pointer fade-in';
        card.onclick = () => window.location.href = `profile.html?uid=${business.id}`;
        
        card.innerHTML = `
          <div class="h-40 bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
            ${business.profileImageURL ? 
              `<img src="${business.profileImageURL}" class="w-full h-full object-cover" />` :
              `<div class="text-white text-6xl font-bold">${initial}</div>`
            }
          </div>
          <div class="p-6">
            <h3 class="font-bold text-lg text-gray-800 mb-2">${displayName}</h3>
            <p class="text-sm text-gray-600 mb-3 line-clamp-2">${business.bio || business.description || 'No description available'}</p>
            <div class="flex items-center gap-2 text-sm text-gray-500 mb-2">
              <i data-lucide="tag" class="w-4 h-4"></i>
              <span>${business.category || 'Uncategorized'}</span>
            </div>
            ${business.city || business.province ? `
              <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
                <i data-lucide="map-pin" class="w-4 h-4"></i>
                <span>${business.city || ''}${business.city && business.province ? ', ' : ''}${business.province || ''}</span>
              </div>
            ` : '<div class="mb-4"></div>'}
            <div class="flex gap-2">
              <button onclick="event.stopPropagation(); window.location.href='chat.html?uid=${business.id}'" 
                class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">
                <i data-lucide="message-circle" class="w-4 h-4"></i>
                Message
              </button>
              <button onclick="event.stopPropagation(); window.location.href='profile.html?uid=${business.id}'" 
                class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
      
      lucide.createIcons();
    }

    // Search and filters
    document.getElementById('searchInput').addEventListener('input', filterBusinesses);
    document.getElementById('categoryFilter').addEventListener('change', filterBusinesses);
    document.getElementById('provinceFilter').addEventListener('change', filterBusinesses);
    document.getElementById('sortFilter').addEventListener('change', filterBusinesses);

    function filterBusinesses() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categoryFilter').value;
      const province = document.getElementById('provinceFilter').value;
      const sortBy = document.getElementById('sortFilter').value;
      
      // Filter
      let filtered = allBusinesses.filter(b => {
        const displayName = (b.businessName || b.name || '').toLowerCase();
        const description = (b.bio || b.description || '').toLowerCase();
        const businessCategory = (b.category || '').toLowerCase();
        
        const matchesSearch = !searchTerm || 
          displayName.includes(searchTerm) ||
          description.includes(searchTerm) ||
          businessCategory.includes(searchTerm);
        const matchesCategory = !category || b.category === category;
        const matchesProvince = !province || b.province === province;
        
        return matchesSearch && matchesCategory && matchesProvince;
      });
      
      // Sort client-side
      if (sortBy === 'name') {
        filtered.sort((a, b) => {
          const nameA = (a.businessName || a.name || '').toLowerCase();
          const nameB = (b.businessName || b.name || '').toLowerCase();
          return nameA.localeCompare(nameB);
        });
      } else if (sortBy === 'newest') {
        filtered.sort((a, b) => {
          const timeA = a.createdAt?.seconds || 0;
          const timeB = b.createdAt?.seconds || 0;
          return timeB - timeA;
        });
      } else if (sortBy === 'category') {
        filtered.sort((a, b) => {
          const catA = (a.category || '').toLowerCase();
          const catB = (b.category || '').toLowerCase();
          return catA.localeCompare(catB);
        });
      }
      
      renderBusinesses(filtered);
    }
  </script>

</body>
</html>
