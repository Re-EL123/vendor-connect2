<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications - VendorConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <button onclick="window.history.back()" class="flex items-center gap-2 text-gray-600 hover:text-gray-800">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
        <span class="font-semibold">Back</span>
      </button>
      <h1 class="text-xl font-bold text-gray-800">Notifications</h1>
      <button onclick="markAllRead()" class="text-sm text-blue-600 hover:text-blue-700 font-semibold">
        Mark all read
      </button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-4 py-6">
    
    <!-- Filter Tabs -->
    <div class="bg-white rounded-2xl shadow-lg mb-6">
      <div class="flex border-b border-gray-200">
        <button onclick="filterNotifications('all')" data-filter="all" 
          class="filter-btn flex-1 py-3 font-semibold border-b-2 border-blue-600 text-blue-600">
          All
        </button>
        <button onclick="filterNotifications('likes')" data-filter="likes" 
          class="filter-btn flex-1 py-3 font-semibold border-b-2 border-transparent text-gray-600 hover:text-gray-800">
          Likes
        </button>
        <button onclick="filterNotifications('comments')" data-filter="comments" 
          class="filter-btn flex-1 py-3 font-semibold border-b-2 border-transparent text-gray-600 hover:text-gray-800">
          Comments
        </button>
        <button onclick="filterNotifications('follows')" data-filter="follows" 
          class="filter-btn flex-1 py-3 font-semibold border-b-2 border-transparent text-gray-600 hover:text-gray-800">
          Follows
        </button>
      </div>
    </div>

    <!-- Notifications List -->
    <div id="notificationsList" class="space-y-3">
      <div class="text-center py-12">
        <i data-lucide="loader" class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3"></i>
        <p class="text-gray-500">Loading notifications...</p>
      </div>
    </div>
  </div>

  <script type="module">
    lucide.createIcons();
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp({
      apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
      authDomain: "online-mall-4422.firebaseapp.com",
      projectId: "online-mall-4422",
      storageBucket: "online-mall-4422.appspot.com"
    });

    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let currentUser = null;
    let allNotifications = [];
    let currentFilter = 'all';

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
      await loadNotifications();
    });

    async function loadNotifications() {
      try {
        // Fetch all notifications for the current user (no orderBy to avoid index requirement)
        const notifQuery = query(
          collection(db, "notifications"),
          where("recipientId", "==", currentUser.uid)
        );
        
        const notifSnapshot = await getDocs(notifQuery);
        
        // Fetch all users once to avoid multiple calls
        const usersSnap = await getDocs(collection(db, "users"));
        const usersMap = {};
        usersSnap.forEach(userDoc => {
          usersMap[userDoc.id] = userDoc.data();
        });
        
        allNotifications = [];
        
        notifSnapshot.forEach(notifDoc => {
          const notif = { id: notifDoc.id, ...notifDoc.data() };
          
          // Get sender info from map
          if (notif.senderId && usersMap[notif.senderId]) {
            notif.senderName = usersMap[notif.senderId].businessName || usersMap[notif.senderId].name || 'Someone';
          } else {
            notif.senderName = 'Someone';
          }
          
          allNotifications.push(notif);
        });
        
        // Sort by creation date (newest first) - client-side sorting
        allNotifications.sort((a, b) => {
          const timeA = a.createdAt?.seconds || 0;
          const timeB = b.createdAt?.seconds || 0;
          return timeB - timeA;
        });
        
        renderNotifications();
      } catch (error) {
        console.error('Error loading notifications:', error);
        const container = document.getElementById('notificationsList');
        container.innerHTML = `
          <div class="text-center py-16">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="alert-circle" class="w-10 h-10 text-red-600"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Error loading notifications</h3>
            <p class="text-gray-600 mb-4">Please try refreshing the page</p>
            <button onclick="location.reload()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
              Refresh
            </button>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function renderNotifications() {
      const container = document.getElementById('notificationsList');
      
      let filtered = allNotifications;
      if (currentFilter !== 'all') {
        const filterType = currentFilter === 'likes' ? 'like' : 
                          currentFilter === 'comments' ? 'comment' : 
                          currentFilter === 'follows' ? 'follow' : '';
        filtered = allNotifications.filter(n => n.type === filterType);
      }
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 fade-in">
            <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <i data-lucide="bell-off" class="w-10 h-10 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-2">No notifications</h3>
            <p class="text-gray-600">You're all caught up!</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }
      
      container.innerHTML = '';
      
      filtered.forEach(notif => {
        const notifCard = document.createElement('div');
        notifCard.className = `bg-white rounded-xl shadow p-4 flex items-start gap-3 cursor-pointer hover:shadow-lg transition-shadow fade-in ${notif.read ? 'opacity-60' : ''}`;
        notifCard.onclick = () => handleNotificationClick(notif);
        
        const icon = getNotificationIcon(notif.type);
        const message = getNotificationMessage(notif);
        const timeAgo = getTimeAgo(notif.createdAt);
        
        notifCard.innerHTML = `
          <div class="w-12 h-12 rounded-full ${icon.bgColor} flex items-center justify-center flex-shrink-0">
            <i data-lucide="${icon.name}" class="w-6 h-6 ${icon.color}"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-gray-800 font-medium mb-1">
              <span class="font-bold">${notif.senderName || 'Someone'}</span>
              ${message}
            </p>
            <p class="text-sm text-gray-500">${timeAgo}</p>
          </div>
          ${!notif.read ? '<div class="w-2 h-2 bg-blue-600 rounded-full flex-shrink-0 mt-2"></div>' : ''}
        `;
        
        container.appendChild(notifCard);
      });
      
      lucide.createIcons();
    }

    function getNotificationIcon(type) {
      const icons = {
        'like': { name: 'heart', bgColor: 'bg-red-100', color: 'text-red-600' },
        'comment': { name: 'message-circle', bgColor: 'bg-blue-100', color: 'text-blue-600' },
        'follow': { name: 'user-plus', bgColor: 'bg-purple-100', color: 'text-purple-600' },
        'message': { name: 'mail', bgColor: 'bg-green-100', color: 'text-green-600' },
        'admin': { name: 'shield', bgColor: 'bg-orange-100', color: 'text-orange-600' }
      };
      return icons[type] || { name: 'bell', bgColor: 'bg-gray-100', color: 'text-gray-600' };
    }

    function getNotificationMessage(notif) {
      const messages = {
        'like': ' liked your post',
        'comment': ' commented on your post',
        'follow': ' started following you',
        'message': ' sent you a message',
        'admin': ' ' + (notif.message || 'sent you a notification')
      };
      return messages[notif.type] || ' interacted with you';
    }

    function getTimeAgo(timestamp) {
      if (!timestamp) return '';
      
      // Handle Firestore timestamp
      const date = timestamp.seconds ? new Date(timestamp.seconds * 1000) : new Date(timestamp);
      const seconds = Math.floor((new Date() - date) / 1000);
      
      if (seconds < 60) return 'Just now';
      if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
      if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
      if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
      
      return date.toLocaleDateString();
    }

    async function handleNotificationClick(notif) {
      try {
        // Mark as read
        if (!notif.read) {
          await updateDoc(doc(db, "notifications", notif.id), { read: true });
          // Update local cache
          const index = allNotifications.findIndex(n => n.id === notif.id);
          if (index !== -1) {
            allNotifications[index].read = true;
          }
        }
        
        // Navigate based on type
        if (notif.postId) {
          window.location.href = `post-details.html?id=${notif.postId}`;
        } else if (notif.type === 'message') {
          window.location.href = `chat.html?uid=${notif.senderId}`;
        } else if (notif.type === 'follow') {
          window.location.href = `profile.html?uid=${notif.senderId}`;
        }
      } catch (error) {
        console.error('Error handling notification click:', error);
      }
    }

    window.filterNotifications = function(filter) {
      currentFilter = filter;
      
      // Update buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('border-blue-600', 'text-blue-600');
        btn.classList.add('border-transparent', 'text-gray-600');
      });
      
      const activeBtn = document.querySelector(`[data-filter="${filter}"]`);
      if (activeBtn) {
        activeBtn.classList.remove('border-transparent', 'text-gray-600');
        activeBtn.classList.add('border-blue-600', 'text-blue-600');
      }
      
      renderNotifications();
    };

    window.markAllRead = async function() {
      try {
        const unreadNotifs = allNotifications.filter(n => !n.read);
        
        if (unreadNotifs.length === 0) {
          alert('All notifications are already read');
          return;
        }
        
        const batch = writeBatch(db);
        
        unreadNotifs.forEach(notif => {
          batch.update(doc(db, "notifications", notif.id), { read: true });
        });
        
        await batch.commit();
        
        // Update local cache
        allNotifications.forEach(notif => {
          notif.read = true;
        });
        
        renderNotifications();
        alert('All notifications marked as read');
      } catch (error) {
        console.error('Error marking all as read:', error);
        alert('Failed to mark all as read. Please try again.');
      }
    };
  </script>

</body>
</html>
