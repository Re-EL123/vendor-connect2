<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Feed - Vendor Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        // Firebase Firestore import
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDR3P8rN4vQ5wX6yZ7aB8cD9eF0gH1iJ2k",
            authDomain: "vendor-connect-7a8b9.firebaseapp.com",
            projectId: "vendor-connect-7a8b9",
            storageBucket: "vendor-connect-7a8b9.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef1234567890ghij"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Get current user
        auth.onAuthStateChanged(user => {
            if (user) {
                loadFeed(user.uid);
            } else {
                window.location.href = 'login.html';
            }
        });

        async function loadFeed(userId) {
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = '<p class="text-center text-gray-500">Loading feed...</p>';

            try {
                // Query posts from followed vendors
                const postsRef = collection(db, 'posts');
                const q = query(postsRef, where('vendorId', '!=', userId));
                
                onSnapshot(q, (snapshot) => {
                    feedContainer.innerHTML = '';
                    if (snapshot.empty) {
                        feedContainer.innerHTML = '<p class="text-center text-gray-500">No posts available</p>';
                        return;
                    }

                    snapshot.forEach(doc => {
                        const post = doc.data();
                        const postElement = document.createElement('div');
                        postElement.className = 'bg-white rounded-lg shadow p-4 mb-4';
                        postElement.innerHTML = `
                            <div class="flex items-center mb-4">
                                <img src="${post.vendorAvatar || 'default-avatar.png'}" alt="Vendor" class="w-10 h-10 rounded-full mr-3">
                                <div>
                                    <h3 class="font-bold text-gray-900">${post.vendorName}</h3>
                                    <p class="text-sm text-gray-500">${new Date(post.timestamp?.toDate()).toLocaleDateString()}</p>
                                </div>
                            </div>
                            <p class="text-gray-700 mb-4">${post.content}</p>
                            ${post.image ? `<img src="${post.image}" alt="Post image" class="w-full rounded mb-4">` : ''}
                            <div class="flex gap-4 text-gray-600">
                                <button class="flex items-center gap-1 hover:text-blue-500">
                                    <span>👍</span> Like (${post.likes || 0})
                                </button>
                                <button class="flex items-center gap-1 hover:text-blue-500">
                                    <span>💬</span> Comment (${post.comments || 0})
                                </button>
                                <button class="flex items-center gap-1 hover:text-blue-500">
                                    <span>↗️</span> Share
                                </button>
                            </div>
                        `;
                        feedContainer.appendChild(postElement);
                    });
                });
            } catch (error) {
                console.error('Error loading feed:', error);
                feedContainer.innerHTML = '<p class="text-center text-red-500">Error loading feed</p>';
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2/dist/tailwind.min.css">
</head>
<body class="bg-gray-50">
    <div class="max-w-2xl mx-auto p-4">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Vendor Feed</h1>
            <p class="text-gray-600">Stay updated with posts from vendors you follow</p>
        </header>
        <div id="feed-container" class="space-y-4">
            <!-- Posts will be loaded here -->
        </div>
    </div>
</body>
</html>
