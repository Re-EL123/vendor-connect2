<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feed - Street Connect</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }

    /* Comment section styles */
    .comment-item {
      transition: background-color 0.2s;
    }
    .comment-item:hover {
      background-color: #f9fafb;
    }

    /* Like animation */
    @keyframes likeAnimation {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .like-animate {
      animation: likeAnimation 0.4s ease-in-out;
    }

    /* Pulse animation for badges */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-badge {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

<!-- Header -->
<header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="text-2xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
      Street Connect
    </h1>

    <div class="flex items-center gap-3">
      <button onclick="window.location.href='search.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="search" class="w-5 h-5 text-gray-600"></i>
      </button>
      <button id="notifBtn" onclick="window.location.href='notifications.html'" class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="bell" class="w-5 h-5 text-gray-600"></i>
        <span id="notifBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full min-w-[20px] h-5 flex items-center justify-center font-bold px-1 pulse-badge"></span>
      </button>
      <button onclick="window.location.href='inbox.html'" class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="message-circle" class="w-5 h-5 text-gray-600"></i>
        <span id="messageBadge" class="hidden absolute -top-1 -right-1 bg-green-500 text-white text-xs rounded-full min-w-[20px] h-5 flex items-center justify-center font-bold px-1 pulse-badge"></span>
      </button>
      <button onclick="window.location.href='settings.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="settings" class="w-5 h-5 text-gray-600"></i>
      </button>
      <div id="userAvatar" class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-semibold text-sm cursor-pointer"
        onclick="window.location.href='profile.html'">
      </div>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="grid md:grid-cols-3 gap-6">

    <!-- Left Sidebar -->
    <aside class="md:col-span-1 space-y-4">
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <div id="userInfo" class="text-center">

      <!-- Dashboard Button -->

    <!-- Main Feed -->

      <!-- Filters -->

          <option value="Free State">Free State</option>
          <option value="Limpopo">Limpopo</option>
          <option value="Mpumalanga">Mpumalanga</option>
          <option value="North West">North West</option>
          <option value="Northern Cape">Northern Cape</option>

          <option value="">All Categories</option>
          <option value="Food">Food & Beverage</option>
          <option value="Tech">Technology</option>
          <option value="Fashion">Fashion</option>
          <option value="Beauty">Beauty</option>

          <option value="Other">Other</option>

      <!-- Loading indicator -->
      <div id="loadingIndicator" class="bg-white rounded-2xl shadow-lg p-12 text-center">
        <i data-lucide="loader" class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3"></i>
        <p class="text-gray-500">Loading posts...</p>

      <!-- Posts Container -->
      <div id="postsContainer" class="space-y-4 hidden"></div>

      <!-- Pagination -->
      <div id="paginationControls" class="hidden flex justify-center items-center gap-4 py-6">

          <i data-lucide="chevron-left" class="w-4 h-4"></i>

        <button id="nextBtn"

</div>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 shadow-lg md:hidden">

<!-- Repost Modal -->

<script type="module">
  lucide.createIcons();

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, query, where, addDoc, doc, getDoc, updateDoc, deleteDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const app = initializeApp({
    apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
    authDomain: "online-mall-4422.firebaseapp.com",
    projectId: "online-mall-4422",
    storageBucket: "online-mall-4422.appspot.com"
  });

  const db = getFirestore(app);
  const auth = getAuth(app);
  const storage = getStorage(app);

  let currentUser = null;
  let userProfile = null;
  let allPosts = [];
  let postComments = {};
  let currentPage = 1;
  const pageSize = 10;
  let repostingPostId = null;

  // View tracking
  const viewedPosts = new Set();
  const viewTimers = new Map();

  onAuthStateChanged(auth, async user => {
    if (!user) return location.href = "login.html";
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        userProfile = userDoc.data();

        const displayName = userProfile.businessName || userProfile.name || 'User';
        const initial = displayName.charAt(0).toUpperCase();

        document.getElementById('userName').textContent = displayName;
        document.getElementById('userType').textContent = userProfile.subscriptionType === 'business' || userProfile.subscriptionType === 'premium' ? 'Business Account' : 'Basic Account';

        document.getElementById('userAvatar').textContent = initial;
        document.getElementById('createPostAvatar').textContent = initial;
        document.querySelector('#userInfo .w-20').textContent = initial;

        const canPost = userProfile.subscriptionType === 'business' || userProfile.subscriptionType === 'premium';

        if (!canPost) {
          document.getElementById('createPostBtn').onclick = () => {
            if (confirm('Upgrade to Business plan to create posts. Visit subscription page?')) {
              window.location.href = 'subscription.html';
            }
          };
        } else {
          const subCard = document.getElementById('subscriptionCard');
          if (subCard) subCard.remove();
          document.getElementById('createPostBtn').onclick = showPostForm;
        }
      }

      await Promise.all([
        fetchAllPosts(),
        fetchAllComments(),
        fetchUnreadNotifications(),
        fetchUnreadMessages()
      ]);

      renderPosts();
      setupViewTracking();
    } catch (error) {
      console.error('Error initializing:', error);
      alert('Error loading profile. Please refresh the page.');
    }
  });

  // Setup IntersectionObserver for view tracking
  function setupViewTracking() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const postId = entry.target.dataset.postId;

        if (entry.isIntersecting && !viewedPosts.has(postId)) {
          // User is viewing the post, start timer
          const timer = setTimeout(() => {
            incrementPostView(postId);
            viewedPosts.add(postId);
          }, 2000); // 2 seconds

          viewTimers.set(postId, timer);
        } else if (!entry.isIntersecting && viewTimers.has(postId)) {
          // User scrolled away, cancel timer
          clearTimeout(viewTimers.get(postId));
          viewTimers.delete(postId);
        }
      });
    }, { threshold: 0.5 }); // 50% of post must be visible

    // Observe all post elements
    document.querySelectorAll('[data-post-id]').forEach(post => {
      observer.observe(post);
    });
  }

  async function incrementPostView(postId) {
    try {
      const postRef = doc(db, "posts", postId);
      await updateDoc(postRef, {
        views: increment(1)
      });

      // Update local post data
      const post = allPosts.find(p => p.id === postId);
      if (post) {
        post.views = (post.views || 0) + 1;
        // Update view count in UI
        const viewsElement = document.querySelector(`[data-post-id="${postId}"] .views-count`);
        if (viewsElement) {
          viewsElement.textContent = `${post.views} ${post.views === 1 ? 'view' : 'views'}`;
        }
      }
    } catch (error) {
      console.error('Error incrementing views:', error);
    }
  }

  async function fetchUnreadNotifications() {
    try {
      const notifQuery = query(
        collection(db, "notifications"),
        where("recipientId", "==", currentUser.uid),
        where("read", "==", false)
      );
      const notifSnap = await getDocs(notifQuery);
      const unreadCount = notifSnap.size;

      if (unreadCount > 0) {
        const badge = document.getElementById('notifBadge');
        badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
        badge.classList.remove('hidden');
      }
    } catch (error) {
      console.error('Error fetching notifications:', error);
    }
  }

  async function fetchUnreadMessages() {
    try {
      const chatsSnap = await getDocs(collection(db, "chats"));
      let totalUnread = 0;

      chatsSnap.forEach(chatDoc => {
        const chatData = chatDoc.data();
        const unreadField = `unread_${currentUser.uid}`;
        if (chatData[unreadField]) {
          totalUnread += chatData[unreadField];
        }
      });

      if (totalUnread > 0) {
        const badge = document.getElementById('messageBadge');
        const mobileBadge = document.getElementById('mobileMessageBadge');
        const displayCount = totalUnread > 99 ? '99+' : totalUnread;

        badge.textContent = displayCount;
        badge.classList.remove('hidden');
        mobileBadge.textContent = displayCount;
        mobileBadge.classList.remove('hidden');
      }
    } catch (error) {
      console.error('Error fetching unread messages:', error);
    }
  }

  async function fetchAllPosts() {
    try {
      const postsSnap = await getDocs(collection(db, "posts"));
      const posts = [];

      const usersSnap = await getDocs(collection(db, "users"));
      const usersMap = {};
      usersSnap.forEach(userDoc => {
        usersMap[userDoc.id] = userDoc.data();
      });

      postsSnap.forEach(postDoc => {
        const postData = { id: postDoc.id, ...postDoc.data() };

        if (postData.uid && usersMap[postData.uid]) {
          const authorData = usersMap[postData.uid];
          postData.authorName = authorData.businessName || authorData.name || 'Unknown User';
          postData.authorCategory = authorData.category || '';
        } else {
          postData.authorName = 'Unknown User';
          postData.authorCategory = '';
        }

        if (postData.isRepost && postData.originalAuthorId && usersMap[postData.originalAuthorId]) {
          const originalAuthor = usersMap[postData.originalAuthorId];
          postData.originalAuthorName = originalAuthor.businessName || originalAuthor.name || 'Unknown User';
        }

        posts.push(postData);
      });

      allPosts = posts.sort((a, b) => {
        const timeA = a.createdAt?.seconds || 0;
        const timeB = b.createdAt?.seconds || 0;
        return timeB - timeA;
      });

    } catch (error) {
      console.error('Error fetching posts:', error);
      alert('Error loading posts. Please refresh the page.');
    }
  }

  async function fetchAllComments() {
    try {
      const commentsSnap = await getDocs(collection(db, "comments"));
      postComments = {};

      const usersSnap = await getDocs(collection(db, "users"));
      const usersMap = {};
      usersSnap.forEach(userDoc => {
        usersMap[userDoc.id] = userDoc.data();
      });

      commentsSnap.forEach(commentDoc => {
        const commentData = { id: commentDoc.id, ...commentDoc.data() };

        if (commentData.userId && usersMap[commentData.userId]) {
          const authorData = usersMap[commentData.userId];
          commentData.authorName = authorData.businessName || authorData.name || 'Unknown User';
        } else {
          commentData.authorName = 'Unknown User';
        }

        if (!postComments[commentData.postId]) {
          postComments[commentData.postId] = [];
        }
        postComments[commentData.postId].push(commentData);
      });

      Object.keys(postComments).forEach(postId => {
        postComments[postId].sort((a, b) => {
          const timeA = a.timestamp?.seconds || 0;
          const timeB = b.timestamp?.seconds || 0;
          return timeA - timeB;
        });
      });

    } catch (error) {
      console.error('Error fetching comments:', error);
    }
  }

  function getTimeAgo(timestamp) {
    if (!timestamp || !timestamp.seconds) return 'Just now';

    const now = Date.now();
    const postTime = timestamp.seconds * 1000;
    const diff = now - postTime;

    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    const weeks = Math.floor(days / 7);
    const months = Math.floor(days / 30);
    const years = Math.floor(days / 365);

    if (years > 0) return `${years}y ago`;
    if (months > 0) return `${months}mo ago`;
    if (weeks > 0) return `${weeks}w ago`;
    if (days > 0) return `${days}d ago`;
    if (hours > 0) return `${hours}h ago`;
    if (minutes > 0) return `${minutes}m ago`;
    return 'Just now';
  }

  function renderPosts() {
    const container = document.getElementById("postsContainer");
    const loading = document.getElementById("loadingIndicator");
    const pagination = document.getElementById("paginationControls");

    container.innerHTML = "";

    let filtered = allPosts.filter(p => {
      const provinceMatch = !document.getElementById('provinceFilter').value || p.province === document.getElementById('provinceFilter').value;
      const categoryMatch = !document.getElementById('categoryFilter').value || p.category === document.getElementById('categoryFilter').value;
      return provinceMatch && categoryMatch;
    });

    const start = (currentPage - 1) * pageSize;
    const pagePosts = filtered.slice(start, start + pageSize);

    loading.classList.add('hidden');
    container.classList.remove('hidden');
    pagination.classList.remove('hidden');

    if (pagePosts.length === 0) {
      container.innerHTML = '<div class="bg-white rounded-2xl shadow-lg p-12 text-center"><p class="text-gray-500">No posts found. Try adjusting your filters.</p></div>';
      pagination.classList.add('hidden');
      return;
    }

    pagePosts.forEach(post => {
      const isLiked = post.likes && Array.isArray(post.likes) && post.likes.includes(currentUser.uid);
      const likesCount = post.likes && Array.isArray(post.likes) ? post.likes.length : 0;
      const isOwner = post.uid === currentUser.uid;
      const comments = postComments[post.id] || [];
      const commentsCount = comments.length;
      const viewsCount = post.views || 0;
      const timeAgo = getTimeAgo(post.createdAt);

      const card = document.createElement("div");
      card.className = "bg-white rounded-2xl shadow-lg p-6 fade-in";
      card.dataset.postId = post.id;
      card.innerHTML = `
        ${post.isRepost ? `
          <div class="flex items-center gap-2 text-sm text-gray-500 mb-3 pb-3 border-b border-gray-100">
            <i data-lucide="repeat" class="w-4 h-4"></i>
            <span><strong class="hover:underline cursor-pointer" onclick="window.location.href='profile.html?uid=${post.uid}'">${post.authorName}</strong> reposted from <strong class="hover:underline cursor-pointer" onclick="window.location.href='profile.html?uid=${post.originalAuthorId}'">${post.originalAuthorName || 'Unknown User'}</strong></span>
          </div>
          ${post.repostComment ? `<p class="text-gray-700 mb-3 italic">"${post.repostComment}"</p>` : ''}
        ` : ''}

        <div class="flex items-start justify-between mb-4">
          <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='profile.html?uid=${post.isRepost ? post.originalAuthorId : post.uid}'">
            <div class="w-12 h-12 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-semibold">
              ${(post.isRepost ? (post.originalAuthorName || 'U') : (post.authorName || 'U')).charAt(0).toUpperCase()}
            </div>
            <div>
              <h3 class="font-bold text-gray-800 hover:underline">${post.isRepost ? (post.originalAuthorName || 'Unknown') : (post.authorName || 'Unknown')}</h3>
              <p class="text-xs text-gray-500">${post.authorCategory || ''} ${post.city || post.province ? '•' : ''} ${post.city || ''} ${post.city && post.province ? ',' : ''} ${post.province || ''}</p>
              <p class="text-xs text-gray-400">${timeAgo}</p>
            </div>
          </div>
          ${isOwner ? `
            <button onclick="deletePost('${post.id}')" class="text-gray-400 hover:text-red-500 transition-colors">
              <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
          ` : ''}
        </div>

        <p class="text-gray-700 mb-3 whitespace-pre-wrap">${post.description || ''}</p>

        ${post.imageURL ? `
          <img src="${post.imageURL}" class="w-full rounded-xl mb-4 max-h-96 object-cover cursor-pointer"
            onclick="window.location.href='post-details.html?id=${post.id}'" />
        ` : ''}

        <div class="flex items-center gap-2 text-xs text-gray-500 mb-3">
          <span class="flex items-center gap-1">
            <i data-lucide="eye" class="w-3 h-3"></i>
            <span class="views-count">${viewsCount} ${viewsCount === 1 ? 'view' : 'views'}</span>
          </span>
        </div>

        <div class="flex items-center gap-6 pt-4 border-t border-gray-100">
          <button onclick="toggleLike('${post.id}')" id="like-btn-${post.id}"
            class="flex items-center gap-2 ${isLiked ? 'text-red-500' : 'text-gray-600'} hover:text-red-500 transition-colors">
            <i data-lucide="heart" class="w-5 h-5 ${isLiked ? 'fill-current' : ''}"></i>
            <span class="text-sm font-medium">${likesCount}</span>
          </button>
          <button onclick="toggleComments('${post.id}')"
            class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors">
            <i data-lucide="message-circle" class="w-5 h-5"></i>
            <span class="text-sm font-medium">${commentsCount}</span>
          </button>
          <button onclick="openRepostModal('${post.id}')"
            class="flex items-center gap-2 text-gray-600 hover:text-green-600 transition-colors">
            <i data-lucide="repeat" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Repost</span>
          </button>
          <button onclick="sharePost('${post.id}')"
            class="flex items-center gap-2 text-gray-600 hover:text-purple-600 transition-colors ml-auto">
            <i data-lucide="share-2" class="w-4 h-4"></i>
          </button>
        </div>

        <div id="comments-${post.id}" class="hidden mt-4 pt-4 border-t border-gray-100">
          <div id="comments-list-${post.id}" class="space-y-3 mb-4 max-h-64 overflow-y-auto">
            ${comments.length === 0 ? '<p class="text-sm text-gray-500 text-center py-4">No comments yet. Be the first to comment!</p>' : ''}
          </div>

          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-semibold text-sm">
              ${(userProfile.businessName || userProfile.name || 'U').charAt(0).toUpperCase()}
            </div>
            <input type="text" id="comment-input-${post.id}"
              placeholder="Write a comment..."
              class="flex-1 px-4 py-2 border border-gray-300 rounded-full focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              onkeypress="if(event.key==='Enter') submitComment('${post.id}')" />
            <button onclick="submitComment('${post.id}')"
              class="p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition-colors">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
      container.appendChild(card);

      if (comments.length > 0) {
        renderComments(post.id, comments);
      }
    });

    lucide.createIcons();
    setupViewTracking();

    document.getElementById('pageNum').textContent = currentPage;
    document.getElementById('prevBtn').disabled = currentPage === 1;
    document.getElementById('nextBtn').disabled = start + pageSize >= filtered.length;
  }

  function renderComments(postId, comments) {
    const commentsList = document.getElementById(`comments-list-${postId}`);
    if (!commentsList) return;

    commentsList.innerHTML = '';

    comments.forEach(comment => {
      const isCommentOwner = comment.userId === currentUser.uid;
      const commentDate = comment.timestamp?.seconds
        ? new Date(comment.timestamp.seconds * 1000).toLocaleString()
        : 'Just now';

      const commentEl = document.createElement('div');
      commentEl.className = 'comment-item flex items-start gap-2 p-2 rounded-lg';
      commentEl.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-pink-500 flex items-center justify-center text-white font-semibold text-xs flex-shrink-0 cursor-pointer"
          onclick="window.location.href='profile.html?uid=${comment.userId}'">
          ${(comment.authorName || 'U').charAt(0).toUpperCase()}
        </div>
        <div class="flex-1 min-w-0">
          <div class="bg-gray-100 rounded-2xl px-4 py-2">
            <p class="font-semibold text-sm text-gray-800 hover:underline cursor-pointer" onclick="window.location.href='profile.html?uid=${comment.userId}'">${comment.authorName || 'Unknown User'}</p>
            <p class="text-sm text-gray-700 break-words">${comment.comment || ''}</p>
          </div>
          <div class="flex items-center gap-3 mt-1 px-2">
            <span class="text-xs text-gray-400">${commentDate}</span>
            ${isCommentOwner ? `
              <button onclick="deleteComment('${comment.id}', '${postId}')" class="text-xs text-red-500 hover:text-red-700">
                Delete
              </button>
            ` : ''}
          </div>
        </div>
      `;
      commentsList.appendChild(commentEl);
    });

    lucide.createIcons();
  }

  window.toggleComments = (postId) => {
    const commentsSection = document.getElementById(`comments-${postId}`);
    if (commentsSection) {
      commentsSection.classList.toggle('hidden');
      lucide.createIcons();
    }
  };

  window.submitComment = async (postId) => {
    const input = document.getElementById(`comment-input-${postId}`);
    const commentText = input.value.trim();

    if (!commentText) {
      alert('Please enter a comment');
      return;
    }

    try {
      await addDoc(collection(db, "comments"), {
        postId: postId,
        userId: currentUser.uid,
        comment: commentText,
        timestamp: serverTimestamp()
      });

      const post = allPosts.find(p => p.id === postId);
      if (post && post.uid !== currentUser.uid) {
        try {
          await addDoc(collection(db, "notifications"), {
            recipientId: post.uid,
            senderId: currentUser.uid,
            type: 'comment',
            postId: postId,
            message: commentText.substring(0, 50),
            read: false,
            createdAt: serverTimestamp()
          });
        } catch (notifError) {
          console.error('Error creating notification:', notifError);
        }
      }

      input.value = '';
      await fetchAllComments();
      renderPosts();

      setTimeout(() => {
        const commentsSection = document.getElementById(`comments-${postId}`);
        if (commentsSection && commentsSection.classList.contains('hidden')) {
          commentsSection.classList.remove('hidden');
        }
        lucide.createIcons();
      }, 100);

    } catch (error) {
      console.error('Error submitting comment:', error);
      alert('Failed to post comment. Please try again.');
    }
  };

  window.deleteComment = async (commentId, postId) => {
    if (!confirm('Delete this comment?')) return;

    try {
      await deleteDoc(doc(db, "comments", commentId));
      await fetchAllComments();
      renderPosts();

      setTimeout(() => {
        const commentsSection = document.getElementById(`comments-${postId}`);
        if (commentsSection && commentsSection.classList.contains('hidden')) {
          commentsSection.classList.remove('hidden');
        }
        lucide.createIcons();
      }, 100);

    } catch (error) {
      console.error('Error deleting comment:', error);
      alert('Failed to delete comment. Please try again.');
    }
  };

  function showPostForm() {
    if (!userProfile || userProfile.subscriptionType === 'basic') {
      alert('Upgrade to Business plan to create posts');
      window.location.href = 'subscription.html';
      return;
    }
    document.getElementById('postFormContainer').classList.remove('hidden');
  }

  window.cancelPost = () => {
    document.getElementById('postFormContainer').classList.add('hidden');
    document.getElementById('postDescription').value = '';
    document.getElementById('postImage').value = '';
    document.getElementById('imagePreview').classList.add('hidden');
  };

  document.getElementById('postImage').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('previewImg').src = ev.target.result;
        document.getElementById('imagePreview').classList.remove('hidden');
        lucide.createIcons();
      };
      reader.readAsDataURL(file);
    }
  };

  window.removeImage = () => {
    document.getElementById('postImage').value = '';
    document.getElementById('imagePreview').classList.add('hidden');
  };

  window.submitPost = async () => {
    const description = document.getElementById('postDescription').value.trim();
    if (!description) {
      alert('Please enter a description');
      return;
    }

    const submitBtn = document.getElementById('submitPostBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Posting...';
    lucide.createIcons();

    try {
      let imageURL = null;
      const imageFile = document.getElementById('postImage').files[0];

      if (imageFile) {
        const storageRef = ref(storage, `posts/${currentUser.uid}/${Date.now()}_${imageFile.name}`);
        await uploadBytes(storageRef, imageFile);
        imageURL = await getDownloadURL(storageRef);
      }

      await addDoc(collection(db, "posts"), {
        description,
        imageURL,
        uid: currentUser.uid,
        province: userProfile.province || '',
        city: userProfile.city || '',
        category: userProfile.category || '',
        likes: [],
        views: 0,
        createdAt: serverTimestamp()
      });

      alert('Post created successfully!');
      cancelPost();
      await fetchAllPosts();
      currentPage = 1;
      renderPosts();
    } catch (error) {
      console.error('Error creating post:', error);
      alert('Failed to create post. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i> Post';
      lucide.createIcons();
    }
  };

  window.toggleLike = async (postId) => {
    const likeBtn = document.getElementById(`like-btn-${postId}`);
    likeBtn.classList.add('like-animate');
    setTimeout(() => likeBtn.classList.remove('like-animate'), 400);

    try {
      const postRef = doc(db, "posts", postId);
      const postSnap = await getDoc(postRef);

      if (!postSnap.exists()) {
        alert('Post not found');
        return;
      }

      const postData = postSnap.data();
      let likes = postData.likes || [];

      if (!Array.isArray(likes)) {
        likes = [];
      }

      const isLiked = likes.includes(currentUser.uid);

      if (isLiked) {
        likes = likes.filter(id => id !== currentUser.uid);
      } else {
        likes = [...likes, currentUser.uid];

        if (postData.uid !== currentUser.uid) {
          try {
            await addDoc(collection(db, "notifications"), {
              recipientId: postData.uid,
              senderId: currentUser.uid,
              type: 'like',
              postId: postId,
              read: false,
              createdAt: serverTimestamp()
            });
          } catch (notifError) {
            console.error('Error creating notification:', notifError);
          }
        }
      }

      await updateDoc(postRef, { likes });
      await fetchAllPosts();
      renderPosts();

    } catch (error) {
      console.error('Error toggling like:', error);
      alert('Failed to update like. Please try again.');
    }
  };

  window.deletePost = async (postId) => {
    if (!confirm('Are you sure you want to delete this post?')) return;

    try {
      await deleteDoc(doc(db, "posts", postId));

      const commentsQuery = query(collection(db, "comments"), where("postId", "==", postId));
      const commentsSnap = await getDocs(commentsQuery);
      const deletePromises = commentsSnap.docs.map(commentDoc => deleteDoc(commentDoc.ref));
      await Promise.all(deletePromises);

      alert('Post deleted successfully!');
      await fetchAllPosts();
      await fetchAllComments();
      renderPosts();
    } catch (error) {
      console.error('Error deleting post:', error);
      alert('Failed to delete post. Please try again.');
    }
  };

  // Repost Modal Functions
  window.openRepostModal = (postId) => {
    if (!userProfile || userProfile.subscriptionType === 'basic') {
      if (confirm('Upgrade to Business plan to repost. Visit subscription page?')) {
        window.location.href = 'subscription.html';
      }
      return;
    }

    const originalPost = allPosts.find(p => p.id === postId);
    if (!originalPost) {
      alert('Original post not found');
      return;
    }

    const existingRepost = allPosts.find(p =>
      p.isRepost &&
      p.originalPostId === postId &&
      p.uid === currentUser.uid
    );

    if (existingRepost) {
      alert('You have already reposted this post');
      return;
    }

    repostingPostId = postId;

    // Show preview
    document.getElementById('originalPostPreview').innerHTML = `
      <p class="text-sm font-semibold text-gray-800 mb-1">${originalPost.authorName}</p>
      <p class="text-sm text-gray-700">${originalPost.description || ''}</p>
    `;

    document.getElementById('repostModal').classList.remove('hidden');
    lucide.createIcons();
  };

  window.closeRepostModal = () => {
    document.getElementById('repostModal').classList.add('hidden');
    document.getElementById('repostComment').value = '';
    repostingPostId = null;
  };

  window.confirmRepost = async () => {
    if (!repostingPostId) return;

    const repostComment = document.getElementById('repostComment').value.trim();
    const confirmBtn = document.getElementById('confirmRepostBtn');

    confirmBtn.disabled = true;
    confirmBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Reposting...';
    lucide.createIcons();

    try {
      const originalPost = allPosts.find(p => p.id === repostingPostId);
      if (!originalPost) {
        alert('Original post not found');
        return;
      }

      const repostData = {
        description: originalPost.description,
        imageURL: originalPost.imageURL,
        uid: currentUser.uid,
        originalPostId: repostingPostId,
        originalAuthorId: originalPost.uid,
        isRepost: true,
        province: userProfile.province || '',
        city: userProfile.city || '',
        category: userProfile.category || '',
        likes: [],
        views: 0,
        createdAt: serverTimestamp()
      };

      if (repostComment) {
        repostData.repostComment = repostComment;
      }

      await addDoc(collection(db, "posts"), repostData);

      if (originalPost.uid !== currentUser.uid) {
        try {
          await addDoc(collection(db, "notifications"), {
            recipientId: originalPost.uid,
            senderId: currentUser.uid,
            type: 'repost',
            postId: repostingPostId,
            read: false,
            createdAt: serverTimestamp()
          });
        } catch (notifError) {
          console.error('Error creating notification:', notifError);
        }
      }

      alert('Reposted successfully!');
      closeRepostModal();
      await fetchAllPosts();
      currentPage = 1;
      renderPosts();
    } catch (error) {
      console.error('Error reposting:', error);
      alert('Failed to repost. Please try again.');
    } finally {
      confirmBtn.disabled = false;
      confirmBtn.innerHTML = '<i data-lucide="repeat" class="w-4 h-4"></i> Repost';
      lucide.createIcons();
    }
  };

  window.sharePost = async (postId) => {
    const url = `${window.location.origin}/post-details.html?id=${postId}`;

    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Check out this post on Street Connect',
          url
        });
      } catch (e) {
        if (e.name !== 'AbortError') {
          await navigator.clipboard.writeText(url);
          alert('Link copied to clipboard!');
        }
      }
    } else {
      try {
        await navigator.clipboard.writeText(url);
        alert('Link copied to clipboard!');
      } catch (e) {
        console.error('Failed to copy:', e);
        alert('Failed to copy link');
      }
    }
  };

  document.getElementById('prevBtn').onclick = () => {
    currentPage--;
    renderPosts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  document.getElementById('nextBtn').onclick = () => {
    currentPage++;
    renderPosts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  document.getElementById('provinceFilter').onchange = () => {
    currentPage = 1;
    renderPosts();
  };

  document.getElementById('categoryFilter').onchange = () => {
    currentPage = 1;
    renderPosts();
  };
</script>

</body>
</html>
