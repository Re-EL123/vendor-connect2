<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Details - Street Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .modal-backdrop {
      backdrop-filter: blur(8px);
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

<header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <button onclick="window.history.back()" class="flex items-center gap-2 text-gray-600 hover:text-gray-800">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
      <span class="font-semibold">Back</span>
    </button>
    <h1 class="text-xl font-bold text-gray-800">Post</h1>
    <div class="w-20"></div>
  </div>
</header>

<main class="p-4 max-w-4xl mx-auto pb-20">
  <!-- Post Container -->
  <div id="postContainer" class="bg-white rounded-2xl shadow-xl p-6 mb-6">
    <div class="text-center py-12">
      <div class="animate-pulse">
        <div class="h-4 bg-gray-200 rounded w-32 mx-auto"></div>
      </div>
      <p class="text-gray-500 mt-4">Loading post...</p>
    </div>
  </div>

  <!-- Comments Section -->
  <div class="bg-white rounded-2xl shadow-xl p-6">
    <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
      <i data-lucide="message-circle" class="w-6 h-6 text-blue-600"></i>
      Comments
    </h2>
    
    <!-- Enhanced comment form with better styling -->
    <form id="commentForm" class="mb-8">
      <div class="flex gap-3">
        <img id="userAvatar" src="https://via.placeholder.com/40" alt="You"
          class="w-10 h-10 rounded-full object-cover border-2 border-blue-200 flex-shrink-0">
        <div class="flex-1">
          <textarea
            id="commentText"
            placeholder="Write a comment..."
            class="w-full border border-gray-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
            rows="3"
            required
          ></textarea>
          <button type="submit" 
            class="mt-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-2 rounded-xl font-semibold hover:shadow-lg transition-all flex items-center gap-2">
            <i data-lucide="send" class="w-4 h-4"></i>
            Post Comment
          </button>
        </div>
      </div>
    </form>

    <div id="commentsContainer" class="space-y-4">
      <p class="text-gray-500 text-center py-8">No comments yet. Be the first to comment!</p>
    </div>
  </div>
</main>

<!-- Image Viewer Modal -->
<div id="imageModal" class="hidden fixed inset-0 bg-black/80 modal-backdrop z-50 flex items-center justify-center p-4" onclick="closeImageModal()">
  <div class="relative max-w-6xl max-h-screen" onclick="event.stopPropagation()">
    <button onclick="closeImageModal()" 
      class="absolute -top-12 right-0 text-white hover:text-gray-300 transition-colors">
      <i data-lucide="x" class="w-8 h-8"></i>
    </button>
    <img id="modalImage" src="" alt="Post image" class="max-w-full max-h-[90vh] rounded-xl">
  </div>
</div>

<!-- Repost Modal -->
<div id="repostModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl p-6 max-w-lg w-full">
    <div class="flex justify-between items-start mb-4">
      <h3 class="text-xl font-bold text-gray-800">Add Your Thoughts</h3>
      <button onclick="closeRepostModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>
    
    <textarea id="repostCaption" rows="3" 
      class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none mb-4"
      placeholder="Add your thoughts to this repost (optional)..."></textarea>
    
    <div id="repostPreview" class="bg-gray-50 rounded-xl p-4 mb-4 border-l-4 border-blue-600">
      <p class="text-sm text-gray-600 mb-2">Reposting from <strong id="originalAuthor"></strong></p>
      <p id="originalContent" class="text-sm text-gray-800"></p>
    </div>
    
    <div class="flex gap-2">
      <button onclick="closeRepostModal()" 
        class="flex-1 px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
        Cancel
      </button>
      <button onclick="confirmRepost()" id="confirmRepostBtn"
        class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-lg font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2">
        <i data-lucide="repeat" class="w-4 h-4"></i>
        Repost
      </button>
    </div>
  </div>
</div>

<script type="module">
lucide.createIcons();

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, getDocs, serverTimestamp, updateDoc, increment, query, orderBy, arrayUnion, arrayRemove, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
  authDomain: "online-mall-4422.firebaseapp.com",
  projectId: "online-mall-4422",
  storageBucket: "online-mall-4422.appspot.com"
});

const db = getFirestore(app);
const auth = getAuth(app);

const urlParams = new URLSearchParams(window.location.search);
const postId = urlParams.get("id");
let currentUser = null;
let currentUserProfile = null;
let postData = null;
let postAuthorData = null;
let viewTracked = false;

onAuthStateChanged(auth, async user => {
  if (!user) return location.href = "login.html";
  currentUser = user;
  
  const userDoc = await getDoc(doc(db, "users", user.uid));
  if (userDoc.exists()) {
    currentUserProfile = userDoc.data();
    const profileImage = currentUserProfile.profileImage || `https://via.placeholder.com/40?text=${encodeURIComponent((currentUserProfile.name || 'U').charAt(0).toUpperCase())}`;
    document.getElementById('userAvatar').src = profileImage;
  }
  
  await loadPost();
  await loadComments();
  
  if (!viewTracked) {
    setTimeout(() => {
      incrementViews();
      viewTracked = true;
    }, 2000);
  }
});

function incrementViews() {
  const postRef = doc(db, "posts", postId);
  updateDoc(postRef, {
    views: increment(1)
  }).catch(error => {
    console.error('Error incrementing views:', error);
  });
}

async function loadPost() {
  try {
    const postRef = doc(db, "posts", postId);
    const postSnap = await getDoc(postRef);
    
    if (!postSnap.exists()) {
      document.getElementById("postContainer").innerHTML = `
        <div class="text-center py-12">
          <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="alert-circle" class="w-8 h-8 text-red-600"></i>
          </div>
          <p class="text-red-600 font-semibold">Post not found</p>
        </div>
      `;
      lucide.createIcons();
      return;
    }
    
    postData = { id: postId, ...postSnap.data() };
    
    let authorName = "Unknown User";
    let authorCategory = "";
    let authorImage = "https://via.placeholder.com/50?text=U";
    
    if (postData.uid) {
      const authorDoc = await getDoc(doc(db, "users", postData.uid));
      if (authorDoc.exists()) {
        postAuthorData = authorDoc.data();
        authorName = postAuthorData.businessName || postAuthorData.name || "Unknown User";
        authorCategory = postAuthorData.category || "";
        authorImage = postAuthorData.profileImage || `https://via.placeholder.com/50?text=${encodeURIComponent(authorName.charAt(0).toUpperCase())}`;
      }
    }
    
    const isLiked = postData.likes && postData.likes.includes(currentUser.uid);
    const likesCount = postData.likes ? postData.likes.length : 0;
    const commentsCount = postData.commentsCount || 0;
    const viewsCount = postData.views || 0;
    const isOwner = postData.uid === currentUser.uid;
    
    const canRepost = currentUserProfile && (currentUserProfile.subscriptionType === 'business' || currentUserProfile.subscriptionType === 'premium');
    
    document.getElementById("postContainer").innerHTML = `
      <!-- Author Header -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='profile.html?uid=${postData.uid}'">
          <img src="${authorImage}" alt="${authorName}"
            class="w-12 h-12 rounded-full object-cover border-2 border-blue-200">
          <div>
            <h3 class="font-bold text-gray-800 hover:underline">${authorName}</h3>
            ${authorCategory ? `<p class="text-sm text-gray-500">${authorCategory}</p>` : ''}
            <p class="text-xs text-gray-400">${new Date(postData.createdAt?.seconds * 1000 || Date.now()).toLocaleDateString()}</p>
          </div>
        </div>
        ${isOwner ? `
          <button onclick="deletePost()" class="text-red-600 hover:text-red-700 p-2">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        ` : ''}
      </div>
      
      <!-- Post Content -->
      <div class="mb-4">
        <p class="text-gray-700 leading-relaxed whitespace-pre-wrap">${postData.description || postData.title || ''}</p>
      </div>
      
      ${postData.imageURL ? `
        <img src="${postData.imageURL}" class="rounded-xl w-full mb-4 cursor-pointer hover:opacity-95 transition-opacity" 
          onclick="openImageModal('${postData.imageURL}')" />
      ` : ''}
      
      <!-- Location -->
      ${postData.city && postData.province ? `
        <div class="flex items-center gap-1 text-sm text-gray-500 mb-4">
          <i data-lucide="map-pin" class="w-4 h-4"></i>
          <span>${postData.city}, ${postData.province}</span>
        </div>
      ` : ''}
      
      <!-- Stats -->
      <div class="flex items-center gap-4 text-xs text-gray-500 mb-4 pb-4 border-b border-gray-100">
        <span class="flex items-center gap-1">
          <i data-lucide="eye" class="w-3 h-3"></i>
          ${viewsCount} ${viewsCount === 1 ? 'view' : 'views'}
        </span>
        <span class="flex items-center gap-1">
          <i data-lucide="heart" class="w-3 h-3"></i>
          ${likesCount} ${likesCount === 1 ? 'like' : 'likes'}
        </span>
        <span class="flex items-center gap-1">
          <i data-lucide="message-circle" class="w-3 h-3"></i>
          ${commentsCount} ${commentsCount === 1 ? 'comment' : 'comments'}
        </span>
      </div>
      
      <!-- Actions -->
      <div class="flex items-center gap-6">
        <button onclick="toggleLike()" id="likeBtn"
          class="flex items-center gap-2 ${isLiked ? 'text-red-500' : 'text-gray-600'} hover:text-red-500 transition-colors">
          <i data-lucide="heart" class="w-5 h-5 ${isLiked ? 'fill-current' : ''}"></i>
          <span class="font-medium text-sm">Like</span>
        </button>
        <button onclick="document.getElementById('commentText').focus()" 
          class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors">
          <i data-lucide="message-circle" class="w-5 h-5"></i>
          <span class="font-medium text-sm">Comment</span>
        </button>
        ${canRepost ? `
          <button onclick="openRepostModal()" 
            class="flex items-center gap-2 text-gray-600 hover:text-green-600 transition-colors">
            <i data-lucide="repeat" class="w-5 h-5"></i>
            <span class="font-medium text-sm">Repost</span>
          </button>
        ` : ''}
        <button onclick="sharePost()" 
          class="flex items-center gap-2 text-gray-600 hover:text-purple-600 transition-colors ml-auto">
          <i data-lucide="share-2" class="w-5 h-5"></i>
          <span class="font-medium text-sm">Share</span>
        </button>
      </div>
    `;
    
    lucide.createIcons();
  } catch (error) {
    console.error("Error loading post:", error);
    document.getElementById("postContainer").innerHTML = `
      <div class="text-center py-12">
        <p class="text-red-500">Error loading post</p>
      </div>
    `;
  }
}

async function loadComments() {
  try {
    const commentsQuery = query(
      collection(db, "comments"),
      orderBy("timestamp", "desc")
    );
    const snapshot = await getDocs(commentsQuery);
    
    const container = document.getElementById("commentsContainer");
    
    const postComments = [];
    for (const commentDoc of snapshot.docs) {
      const comment = commentDoc.data();
      if (comment.postId === postId) {
        if (comment.userId) {
          const userDoc = await getDoc(doc(db, "users", comment.userId));
          if (userDoc.exists()) {
            const userData = userDoc.data();
            comment.userName = userData.businessName || userData.name || "Unknown User";
            comment.userImage = userData.profileImage || `https://via.placeholder.com/40?text=${encodeURIComponent(comment.userName.charAt(0).toUpperCase())}`;
          }
        }
        postComments.push({ id: commentDoc.id, ...comment });
      }
    }
    
    if (postComments.length === 0) {
      container.innerHTML = `
        <div class="text-center py-8">
          <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="message-circle" class="w-8 h-8 text-gray-400"></i>
          </div>
          <p class="text-gray-600">No comments yet</p>
          <p class="text-sm text-gray-500 mt-1">Be the first to comment!</p>
        </div>
      `;
      lucide.createIcons();
      return;
    }
    
    container.innerHTML = "";
    
    postComments.forEach(comment => {
      const div = document.createElement("div");
      div.className = "bg-gray-50 rounded-xl p-4 hover:bg-gray-100 transition-colors";
      
      const timeAgo = getTimeAgo(comment.timestamp?.toDate());
      const isCommentOwner = comment.userId === currentUser.uid;
      
      div.innerHTML = `
        <div class="flex gap-3">
          <img src="${comment.userImage || 'https://via.placeholder.com/40'}" 
            alt="${comment.userName}" 
            class="w-10 h-10 rounded-full object-cover border-2 border-blue-200 flex-shrink-0 cursor-pointer"
            onclick="window.location.href='profile.html?uid=${comment.userId}'">
          <div class="flex-1">
            <div class="flex items-center justify-between mb-1">
              <div class="flex items-center gap-2">
                <p class="font-semibold text-gray-800 hover:underline cursor-pointer" 
                  onclick="window.location.href='profile.html?uid=${comment.userId}'">${comment.userName || 'Unknown User'}</p>
                <span class="text-xs text-gray-400">${timeAgo}</span>
              </div>
              ${isCommentOwner ? `
                <button onclick="deleteComment('${comment.id}')" class="text-red-500 hover:text-red-700 text-xs">
                  Delete
                </button>
              ` : ''}
            </div>
            <p class="text-gray-700">${comment.comment}</p>
          </div>
        </div>
      `;
      container.appendChild(div);
    });
    
    lucide.createIcons();
  } catch (error) {
    console.error("Error loading comments:", error);
  }
}

function getTimeAgo(date) {
  if (!date) return '';
  const seconds = Math.floor((new Date() - date) / 1000);
  
  if (seconds < 60) return 'Just now';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  if (seconds < 604800) return Math.floor(seconds / 86400) + 'd ago';
  
  return date.toLocaleDateString();
}

window.openImageModal = (imageUrl) => {
  document.getElementById('modalImage').src = imageUrl;
  document.getElementById('imageModal').classList.remove('hidden');
  lucide.createIcons();
};

window.closeImageModal = () => {
  document.getElementById('imageModal').classList.add('hidden');
};

window.openRepostModal = () => {
  if (!currentUserProfile || currentUserProfile.subscriptionType === 'basic') {
    if (confirm('Upgrade to Business plan to repost. Visit subscription page?')) {
      window.location.href = 'subscription.html';
    }
    return;
  }
  
  if (!postData || !postAuthorData) {
    alert('Post data not loaded yet');
    return;
  }
  
  document.getElementById('originalAuthor').textContent = postAuthorData.businessName || postAuthorData.name || 'Unknown User';
  document.getElementById('originalContent').textContent = postData.description?.substring(0, 150) + (postData.description?.length > 150 ? '...' : '');
  document.getElementById('repostCaption').value = '';
  document.getElementById('repostModal').classList.remove('hidden');
  lucide.createIcons();
};

window.closeRepostModal = () => {
  document.getElementById('repostModal').classList.add('hidden');
};

window.confirmRepost = async () => {
  if (!postData) return;
  
  const repostCaption = document.getElementById('repostCaption').value.trim();
  const confirmBtn = document.getElementById('confirmRepostBtn');
  
  confirmBtn.disabled = true;
  confirmBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Reposting...';
  lucide.createIcons();
  
  try {
    await addDoc(collection(db, "posts"), {
      description: postData.description,
      imageURL: postData.imageURL,
      uid: currentUser.uid,
      originalPostId: postData.id,
      originalAuthorId: postData.uid,
      isRepost: true,
      repostCaption: repostCaption || null,
      province: currentUserProfile.province || '',
      city: currentUserProfile.city || '',
      category: currentUserProfile.category || '',
      likes: [],
      views: 0,
      createdAt: serverTimestamp()
    });
    
    if (postData.uid !== currentUser.uid) {
      try {
        await addDoc(collection(db, "notifications"), {
          recipientId: postData.uid,
          senderId: currentUser.uid,
          type: 'repost',
          postId: postData.id,
          read: false,
          createdAt: serverTimestamp()
        });
      } catch (notifError) {
        console.error('Error creating notification:', notifError);
      }
    }
    
    alert('Reposted successfully!');
    closeRepostModal();
    window.location.href = 'feed.html';
  } catch (error) {
    console.error('Error reposting:', error);
    alert('Failed to repost. Please try again.');
  } finally {
    confirmBtn.disabled = false;
    confirmBtn.innerHTML = '<i data-lucide="repeat" class="w-4 h-4"></i> Repost';
    lucide.createIcons();
  }
};

document.getElementById("commentForm").onsubmit = async (e) => {
  e.preventDefault();
  
  const commentText = document.getElementById("commentText").value.trim();
  if (!commentText) return;
  
  try {
    await addDoc(collection(db, "comments"), {
      postId: postId,
      userId: currentUser.uid,
      comment: commentText,
      timestamp: serverTimestamp()
    });
    
    const postRef = doc(db, "posts", postId);
    await updateDoc(postRef, {
      commentsCount: increment(1)
    });
    
    if (postData.uid !== currentUser.uid) {
      await addDoc(collection(db, "notifications"), {
        recipientId: postData.uid,
        senderId: currentUser.uid,
        type: 'comment',
        postId: postId,
        read: false,
        createdAt: serverTimestamp()
      });
    }
    
    document.getElementById("commentText").value = "";
    await loadComments();
    await loadPost();
  } catch (error) {
    console.error("Error posting comment:", error);
    alert("Failed to post comment");
  }
};

window.deleteComment = async (commentId) => {
  if (!confirm('Delete this comment?')) return;
  
  try {
    await deleteDoc(doc(db, "comments", commentId));
    
    const postRef = doc(db, "posts", postId);
    await updateDoc(postRef, {
      commentsCount: increment(-1)
    });
    
    await loadComments();
    await loadPost();
  } catch (error) {
    console.error("Error deleting comment:", error);
    alert('Failed to delete comment');
  }
};

window.toggleLike = async () => {
  try {
    const postRef = doc(db, "posts", postId);
    const isLiked = postData.likes && postData.likes.includes(currentUser.uid);
    
    if (isLiked) {
      await updateDoc(postRef, {
        likes: arrayRemove(currentUser.uid)
      });
    } else {
      await updateDoc(postRef, {
        likes: arrayUnion(currentUser.uid)
      });
      
      if (postData.uid !== currentUser.uid) {
        await addDoc(collection(db, "notifications"), {
          recipientId: postData.uid,
          senderId: currentUser.uid,
          type: 'like',
          postId: postId,
          read: false,
          createdAt: serverTimestamp()
        });
      }
    }
    
    await loadPost();
  } catch (error) {
    console.error("Error toggling like:", error);
  }
};

window.deletePost = async () => {
  if (!confirm('Delete this post? This action cannot be undone.')) return;
  
  try {
    await deleteDoc(doc(db, "posts", postId));
    alert('Post deleted successfully');
    window.location.href = 'feed.html';
  } catch (error) {
    console.error("Error deleting post:", error);
    alert('Failed to delete post');
  }
};

window.sharePost = async () => {
  const url = `${window.location.origin}/post-details.html?id=${postId}`;
  
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'Check out this post on VendorConnect',
        url: url
      });
    } catch (error) {
      if (error.name !== 'AbortError') {
        console.error('Error sharing:', error);
      }
    }
  } else {
    await navigator.clipboard.writeText(url);
    alert('Link copied to clipboard!');
  }
};
</script>

</body>
</html>
