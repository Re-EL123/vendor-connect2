<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout — Street Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 via-indigo-100 to-purple-100 min-h-screen">

  <!-- HEADER -->
  <header class="p-4 bg-white/80 backdrop-blur shadow">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-extrabold text-indigo-700">Street Connect</h1>
      <button onclick="window.history.back()" class="text-sm text-gray-600 hover:text-indigo-600">← Back</button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto p-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Cart Items -->
      <div class="lg:col-span-2">
        <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6">
          <h2 class="text-2xl font-bold text-indigo-700 mb-6">Shopping Cart</h2>
          <div id="cartItems" class="space-y-4">
            <p class="text-gray-500 text-center py-8">Loading cart...</p>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="lg:col-span-1">
        <div class="bg-white/80 backdrop-blur rounded-2xl shadow-xl p-6 sticky top-4">
          <h2 class="text-xl font-bold text-indigo-700 mb-4">Order Summary</h2>
          
          <div class="space-y-3 mb-6">
            <div class="flex justify-between text-gray-700">
              <span>Subtotal:</span>
              <span id="subtotal">R 0.00</span>
            </div>
            <div class="flex justify-between text-gray-700">
              <span>Delivery:</span>
              <span id="delivery">R 50.00</span>
            </div>
            <div class="border-t pt-3 flex justify-between text-lg font-bold text-indigo-700">
              <span>Total:</span>
              <span id="total">R 0.00</span>
            </div>
          </div>

          <div class="mb-4 p-3 bg-blue-50 rounded-lg">
            <p class="text-sm text-gray-700">Wallet Balance:</p>
            <p id="walletBalance" class="text-xl font-bold text-indigo-700">R 0.00</p>
          </div>

          <button id="payBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 font-semibold mb-2">
            Pay with Wallet
          </button>
          
          <button onclick="window.location.href='marketplace.html'" class="w-full bg-gray-200 text-gray-700 py-3 rounded-lg hover:bg-gray-300 font-semibold">
            Continue Shopping
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
  authDomain: "online-mall-4422.firebaseapp.com",
  databaseURL: "https://online-mall-4422-default-rtdb.firebaseio.com",
  projectId: "online-mall-4422",
  storageBucket: "online-mall-4422.appspot.com",
  messagingSenderId: "947082232783",
  appId: "1:947082232783:web:116206502e5fb38383c8ba"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let currentUser = null;
const deliveryFee = 50;

auth.onAuthStateChanged(async user => {
  if (!user) return location.href = "login.html";
  currentUser = user;
  
  renderCart();
  await loadWalletBalance();
});

function renderCart() {
  const container = document.getElementById("cartItems");
  
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="text-center py-12">
        <p class="text-6xl mb-4">🛒</p>
        <p class="text-gray-500 text-lg mb-4">Your cart is empty</p>
        <button onclick="window.location.href='marketplace.html'" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
          Start Shopping
        </button>
      </div>
    `;
    updateSummary();
    return;
  }

  container.innerHTML = cart.map((item, index) => `
    <div class="flex gap-4 p-4 bg-gray-50 rounded-lg">
      ${item.imageUrl ? `
        <img src="${item.imageUrl}" class="w-20 h-20 object-cover rounded-lg" />
      ` : `
        <div class="w-20 h-20 bg-indigo-200 rounded-lg flex items-center justify-center">
          <span class="text-2xl">📦</span>
        </div>
      `}
      <div class="flex-1">
        <h3 class="font-semibold text-gray-800">${item.title}</h3>
        <p class="text-sm text-gray-600">R ${parseFloat(item.price).toFixed(2)}</p>
        <div class="flex items-center gap-2 mt-2">
          <button onclick="updateQty(${index}, -1)" class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">-</button>
          <span class="px-3">${item.qty}</span>
          <button onclick="updateQty(${index}, 1)" class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">+</button>
        </div>
      </div>
      <div class="text-right">
        <p class="font-bold text-indigo-700">R ${(item.price * item.qty).toFixed(2)}</p>
        <button onclick="removeItem(${index})" class="text-red-600 text-sm mt-2 hover:underline">Remove</button>
      </div>
    </div>
  `).join('');

  updateSummary();
}

function updateQty(index, change) {
  cart[index].qty += change;
  
  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }
  
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function removeItem(index) {
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  renderCart();
}

function updateSummary() {
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const total = subtotal + (cart.length > 0 ? deliveryFee : 0);
  
  document.getElementById("subtotal").textContent = `R ${subtotal.toFixed(2)}`;
  document.getElementById("delivery").textContent = cart.length > 0 ? `R ${deliveryFee.toFixed(2)}` : "R 0.00";
  document.getElementById("total").textContent = `R ${total.toFixed(2)}`;
}

async function loadWalletBalance() {
  const walletRef = db.ref(`users/${currentUser.uid}/wallet/balance`);
  const snap = await walletRef.once("value");
  const balance = snap.val() || 0;
  
  document.getElementById("walletBalance").textContent = `R ${parseFloat(balance).toFixed(2)}`;
}

document.getElementById("payBtn").onclick = async () => {
  if (cart.length === 0) {
    alert("Your cart is empty");
    return;
  }

  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const total = subtotal + deliveryFee;

  const walletRef = db.ref(`users/${currentUser.uid}/wallet/balance`);
  const snap = await walletRef.once("value");
  const balance = snap.val() || 0;

  if (balance < total) {
    alert(`Insufficient balance. You need R ${(total - balance).toFixed(2)} more.`);
    return;
  }

  if (!confirm(`Confirm payment of R ${total.toFixed(2)}?`)) return;

  try {
    // Deduct from wallet
    await walletRef.set(balance - total);

    // Create order
    await db.ref("orders").push({
      userId: currentUser.uid,
      items: cart,
      subtotal,
      deliveryFee,
      total,
      status: "pending",
      createdAt: new Date().toISOString()
    });

    // Add transaction
    await db.ref(`transactions/${currentUser.uid}`).push({
      type: "purchase",
      amount: total,
      description: `Order of ${cart.length} items`,
      createdAt: new Date().toISOString()
    });

    // Clear cart
    localStorage.removeItem("cart");
    cart = [];

    alert("Payment successful! Your order has been placed.");
    window.location.href = "feed.html";
  } catch (error) {
    alert("Payment failed: " + error.message);
  }
};
</script>

</body>
</html>
