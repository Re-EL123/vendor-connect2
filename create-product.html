<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Product - Street Connect</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .slide-in { animation: slideIn 0.4s ease-out; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-badge {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

<!-- Header -->
<header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <button onclick="window.history.back()" class="p-3 hover:bg-gray-100 rounded-xl transition-all shadow-sm">
        <i data-lucide="arrow-left" class="w-6 h-6 text-gray-700"></i>
      </button>
      <h1 id="pageTitle" class="text-3xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
        New Product
      </h1>
    </div>
    
    <div class="flex items-center gap-3">
      <button id="previewBtn" onclick="togglePreview()" class="p-3 hover:bg-gray-100 rounded-xl transition-all shadow-sm">
        <i data-lucide="eye" class="w-6 h-6 text-gray-700"></i>
      </button>
      <div id="userAvatar" class="w-12 h-12 rounded-2xl bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-lg shadow-lg cursor-pointer" onclick="window.location.href='profile.html'"></div>
    </div>
  </div>
</header>

<div class="max-w-4xl mx-auto px-4 py-8">
  <div class="grid lg:grid-cols-2 gap-8">
    
    <!-- Product Form -->
    <div id="formSection" class="lg:col-span-1 space-y-6">
      <div class="bg-white rounded-3xl shadow-2xl p-8 fade-in">
        <h2 class="text-2xl font-bold text-gray-900 mb-2 flex items-center gap-3">
          <i data-lucide="package" class="w-8 h-8 text-emerald-600"></i>
          <span id="formTitle">Product Details</span>
        </h2>
        <p class="text-gray-600 mb-8" id="formSubtitle">Fill in all fields to list your product</p>
        
        <form id="productForm" class="space-y-6">
          <!-- Product Name -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Product Name</label>
            <input type="text" id="productName" required
              class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:ring-4 focus:ring-blue-500 focus:border-transparent transition-all text-lg font-semibold"
              placeholder="e.g. Plate">
          </div>

          <!-- Category -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Category</label>
            <select id="productCategory" required
              class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:ring-4 focus:ring-blue-500 focus:border-transparent transition-all text-lg">
              <option value="">Select Category</option>
              <option value="Food">Food</option>
              <option value="Tech">Technology</option>
              <option value="Fashion">Fashion</option>
              <option value="Beauty">Beauty & Wellness</option>
              <option value="Services">Services</option>
              <option value="Electronics">Electronics</option>
              <option value="Home">Home & Garden</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Price -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Price (ZAR)</label>
            <input type="number" id="productPrice" step="0.01" min="0" required
              class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:ring-4 focus:ring-emerald-500 focus:border-transparent transition-all text-lg font-mono"
              placeholder="50">
          </div>

          <!-- Description -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
            <textarea id="productDescription" rows="4" required
              class="w-full px-5 py-4 border-2 border-gray-200 rounded-2xl focus:ring-4 focus:ring-blue-500 focus:border-transparent transition-all resize-vertical text-lg"
              placeholder="Delicious & Mouth Watering Dish"></textarea>
          </div>

          <!-- Image Upload -->
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-4 flex items-center gap-2">
              Product Image
            </label>
            <div id="imageDropZone" class="border-2 border-dashed border-gray-300 rounded-3xl p-8 text-center hover:border-blue-400 transition-all bg-gray-50 hover:bg-blue-50">
              <i data-lucide="image-plus" class="w-16 h-16 text-gray-400 mx-auto mb-4"></i>
              <p class="text-lg font-semibold text-gray-700 mb-2">Drop image here or click to browse</p>
              <p class="text-sm text-gray-500 mb-6">JPG, PNG up to 5MB</p>
              <input type="file" id="productImage" accept="image/*" class="hidden">
              <button type="button" onclick="document.getElementById('productImage').click()" 
                class="px-8 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-2xl font-semibold hover:shadow-xl transition-all">
                Choose Image
              </button>
            </div>
            <div id="imagePreview" class="mt-6 hidden">
              <img id="previewImg" class="w-full h-48 object-cover rounded-2xl shadow-lg">
              <button type="button" onclick="removeImage()" class="mt-3 px-4 py-2 bg-red-500 text-white rounded-xl font-semibold hover:bg-red-600 transition-all">
                <i data-lucide="x" class="w-4 h-4 inline mr-1"></i>Remove Image
              </button>
            </div>
          </div>

          <!-- Vendor Info (Hidden) -->
          <input type="hidden" id="vendorId" value="">
          <input type="hidden" id="productId" value="">

          <!-- Publish/Update Button -->
          <button type="submit" id="publishBtn"
            class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white py-6 rounded-3xl font-bold text-xl shadow-2xl hover:shadow-3xl hover:scale-[1.02] transition-all flex items-center justify-center gap-3">
            <i data-lucide="rocket" class="w-7 h-7"></i>
            <span id="btnText">Publish Product</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Preview Section -->
    <div id="previewSection" class="lg:col-span-1 hidden lg:block space-y-6">
      <div class="bg-white rounded-3xl shadow-2xl p-8 sticky top-24">
        <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-3">
          <i data-lucide="eye" class="w-6 h-6 text-blue-600"></i>
          Live Preview
        </h3>
        <div id="productPreview" class="space-y-4 bg-gradient-to-b from-gray-50 to-white rounded-2xl p-6 border-2 border-dashed border-gray-200 min-h-[400px] flex flex-col">
          <div class="text-center py-12">
            <i data-lucide="package" class="w-20 h-20 text-gray-300 mx-auto mb-4"></i>
            <p class="text-gray-500 font-semibold">Preview will appear here</p>
            <p class="text-sm text-gray-400">Fill form on left to see live preview</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile Bottom Nav -->
<nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 shadow-2xl md:hidden">
  <div class="flex justify-around py-4">
    <a href="feed.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="home" class="w-7 h-7"></i>
      <span class="text-xs font-medium mt-1">Feed</span>
    </a>
    <a href="marketplace.html" class="flex flex-col items-center text-emerald-600">
      <i data-lucide="shopping-bag" class="w-7 h-7"></i>
      <span class="text-xs font-bold mt-1">Market</span>
    </a>
    <a href="dashboard.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="layout-dashboard" class="w-7 h-7"></i>
      <span class="text-xs font-medium mt-1">Dashboard</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="user" class="w-7 h-7"></i>
      <span class="text-xs font-medium mt-1">Profile</span>
    </a>
  </div>
</nav>

<script type="module">
  lucide.createIcons();
  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc, addDoc, setDoc, collection, serverTimestamp, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
    authDomain: "online-mall-4422.firebaseapp.com",
    projectId: "online-mall-4422",
    storageBucket: "online-mall-4422.appspot.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const auth = getAuth(app);

  let currentUser = null;
  let currentVendorId = null;
  let imageFile = null;
  let isEditMode = false;
  let editingProductId = null;

  // Auth check & init
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    currentUser = user;
    await initPage();
  });

  async function initPage() {
    // Check for edit mode
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    const vendorId = urlParams.get('vendor');
    
    if (editId && vendorId) {
      isEditMode = true;
      currentVendorId = vendorId;
      editingProductId = editId;
      await loadProductForEdit(editId, vendorId);
    } else {
      // Find vendor for new product
      await findVendor();
    }
    
    setupEventListeners();
    if (isEditMode) {
      updateUIForEdit();
    }
  }

  async function findVendor() {
    const vendorQuery = query(collection(db, "vendors"), where("uid", "==", currentUser.uid));
    const vendorSnap = await getDocs(vendorQuery);
    
    if (!vendorSnap.empty) {
      currentVendorId = vendorSnap.docs[0].id;
      document.getElementById('vendorId').value = currentVendorId;
    }
  }

  async function loadProductForEdit(productId, vendorId) {
    try {
      const productDoc = await getDoc(doc(db, `vendors/${vendorId}/products/${productId}`));
      if (productDoc.exists()) {
        const product = productDoc.data();
        document.getElementById('productName').value = product.name || '';
        document.getElementById('productCategory').value = product.category || '';
        document.getElementById('productPrice').value = product.price || '';
        document.getElementById('productDescription').value = product.description || '';
        document.getElementById('productId').value = productId;
        
        if (product.imageURL) {
          imageFile = { url: product.imageURL };
          showImagePreview(product.imageURL);
        }
      }
    } catch (error) {
      console.error('Error loading product:', error);
    }
  }

  function updateUIForEdit() {
    document.getElementById('pageTitle').textContent = 'Edit Product';
    document.getElementById('formTitle').innerHTML = '<i data-lucide="edit-3" class="w-5 h-5 inline mr-2 text-blue-500"></i>Edit Product Details';
    document.getElementById('formSubtitle').textContent = 'Update your product information';
    document.getElementById('btnText').textContent = 'Update Product';
  }

  // Image handling
  const dropZone = document.getElementById('imageDropZone');
  const fileInput = document.getElementById('productImage');
  const preview = document.getElementById('imagePreview');

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }

  ['dragenter', 'dragover'].forEach(eventName => {
    dropZone.addEventListener(eventName, highlight, false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, unhighlight, false);
  });

  function highlight(e) {
    dropZone.classList.add('bg-blue-50', 'border-blue-400');
  }

  function unhighlight(e) {
    dropZone.classList.remove('bg-blue-50', 'border-blue-400');
  }

  fileInput.addEventListener('change', handleImage);
  dropZone.addEventListener('drop', handleDrop);

  function handleImage(e) {
    const file = e.target.files[0];
    if (file) {
      imageFile = file;
      const reader = new FileReader();
      reader.onload = (e) => showImagePreview(e.target.result);
      reader.readAsDataURL(file);
    }
  }

  function handleDrop(e) {
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      imageFile = file;
      const reader = new FileReader();
      reader.onload = (e) => showImagePreview(e.target.result);
      reader.readAsDataURL(file);
    }
  }

  function showImagePreview(src) {
    preview.classList.remove('hidden');
    document.getElementById('previewImg').src = src;
  }

  window.removeImage = () => {
    imageFile = null;
    preview.classList.add('hidden');
    fileInput.value = '';
  };

  function setupEventListeners() {
    // Live preview
    ['productName', 'productPrice', 'productCategory', 'productDescription'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    // Preview toggle
    window.togglePreview = () => {
      const formSection = document.getElementById('formSection');
      const previewSection = document.getElementById('previewSection');
      formSection.classList.toggle('lg:col-span-2');
      previewSection.classList.toggle('hidden');
    };
  }

  function updatePreview() {
    const previewEl = document.getElementById('productPreview');
    const name = document.getElementById('productName').value || 'Your Product';
    const price = document.getElementById('productPrice').value;
    const category = document.getElementById('productCategory').value;
    const desc = document.getElementById('productDescription').value;
    
    previewEl.innerHTML = `
      <div class="space-y-4">
        <div class="w-full h-48 bg-gradient-to-r from-emerald-100 to-teal-100 rounded-2xl flex items-center justify-center overflow-hidden">
          ${imageFile ? (typeof imageFile === 'string' ? `<img src="${imageFile}" class="w-full h-full object-cover">` : 'Image Preview') : 
            `<i data-lucide="package" class="w-20 h-20 text-emerald-400"></i>`}
        </div>
        <div>
          <h3 class="font-bold text-xl text-gray-900 truncate">${name}</h3>
          <p class="text-sm text-gray-500">${category || 'Category'}</p>
          ${price ? `<p class="text-2xl font-bold text-emerald-600 mt-1">R${parseFloat(price).toLocaleString()}</p>` : ''}
          <p class="text-gray-600 leading-relaxed mt-3 line-clamp-3">${desc || 'Description'}</p>
        </div>
      </div>
    `;
    lucide.createIcons();
  }

  // Form submission
  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (!currentVendorId) {
      alert('No vendor found. Please create a vendor profile first.');
      return;
    }

    const publishBtn = document.getElementById('publishBtn');
    publishBtn.disabled = true;
    publishBtn.innerHTML = '<i data-lucide="loader" class="w-7 h-7 animate-spin"></i> Saving...';

    try {
      let imageURL = '';
      
      // Upload image if new file
      if (imageFile && typeof imageFile !== 'string') {
        const storageRef = ref(storage, `products/${currentVendorId}/${Date.now()}_${imageFile.name}`);
        await uploadBytes(storageRef, imageFile);
        imageURL = await getDownloadURL(storageRef);
      } else if (imageFile) {
        imageURL = imageFile.url || imageFile;
      }

      const productData = {
        name: document.getElementById('productName').value,
        category: document.getElementById('productCategory').value,
        description: document.getElementById('productDescription').value,
        price: parseFloat(document.getElementById('productPrice').value),
        imageURL: imageURL,
        isApproved: false,
        createdAt: serverTimestamp()
      };

      if (isEditMode && editingProductId) {
        // Update existing product
        await setDoc(doc(db, `vendors/${currentVendorId}/products/${editingProductId}`), productData, { merge: true });
        alert('✅ Product updated successfully!');
        window.location.href = 'manage-products.html';
      } else {
        // Create new product
        await addDoc(collection(db, `vendors/${currentVendorId}/products`), productData);
        alert('✅ Product created successfully!');
        window.location.href = 'manage-products.html';
      }
      
    } catch (error) {
      console.error('Error saving product:', error);
      alert('❌ Failed to save product. Please try again.');
    } finally {
      publishBtn.disabled = false;
      publishBtn.innerHTML = isEditMode ? 
        '<i data-lucide="save" class="w-7 h-7"></i> Update Product' : 
        '<i data-lucide="rocket" class="w-7 h-7"></i> Publish Product';
      lucide.createIcons();
    }
  });
</script>

</body>
</html>
