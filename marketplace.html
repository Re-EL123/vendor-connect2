<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marketplace - VendorConnect</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen">

<!-- Header -->
<header class="bg-white/90 backdrop-blur-lg border-b border-gray-200 sticky top-0 z-50 shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <h1 class="text-2xl font-extrabold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
      VendorConnect
    </h1>
    
    <div class="flex items-center gap-3">
      <button onclick="window.location.href='search.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="search" class="w-5 h-5 text-gray-600"></i>
      </button>
      <button id="notifBtn" onclick="window.location.href='notifications.html'" class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="bell" class="w-5 h-5 text-gray-600"></i>
        <span id="notifBadge" class="hidden absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
      <button onclick="viewCart()" class="relative p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="shopping-cart" class="w-5 h-5 text-gray-600"></i>
        <span id="cartBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
      </button>
      <button onclick="window.location.href='settings.html'" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
        <i data-lucide="settings" class="w-5 h-5 text-gray-600"></i>
      </button>
      <div id="userAvatar" class="w-8 h-8 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-semibold text-sm cursor-pointer"
        onclick="window.location.href='profile.html'">
      </div>
    </div>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-6">
  
  <!-- Add Product Section (Business/Premium only) -->
  <div id="addProductSection" class="hidden mb-6">
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold text-gray-800">My Products</h2>
        <button id="addProductBtn" onclick="showAddProductForm()" 
          class="flex items-center gap-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-lg font-semibold hover:shadow-lg transition-all">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Add Product
        </button>
      </div>
      
      <!-- Add Product Form -->
      <div id="productFormContainer" class="hidden pt-4 border-t">
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Product Name</label>
            <input id="productName" type="text" 
              class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="Enter product name" />
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Price (R)</label>
            <input id="productPrice" type="number" step="0.01" 
              class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="0.00" />
          </div>
        </div>
        
        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
          <select id="productCategory" 
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option value="Food">Food & Beverage</option>
            <option value="Tech">Technology</option>
            <option value="Fashion">Fashion</option>
            <option value="Beauty">Beauty</option>
            <option value="Services">Services</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
          <textarea id="productDescription" rows="3" 
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
            placeholder="Describe your product..."></textarea>
        </div>
        
        <div class="mt-4">
          <label class="block text-sm font-medium text-gray-700 mb-2">Product Image</label>
          <input id="productImage" type="file" accept="image/*" class="hidden" />
          <button onclick="document.getElementById('productImage').click()" 
            class="flex items-center gap-2 text-gray-600 hover:text-blue-600 transition-colors">
            <i data-lucide="image" class="w-5 h-5"></i>
            <span class="text-sm font-medium">Upload Photo</span>
          </button>
          
          <div id="productImagePreview" class="hidden mt-3">
            <div class="relative inline-block">
              <img id="previewProductImg" class="rounded-xl max-h-48" />
              <button onclick="removeProductImage()" 
                class="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full hover:bg-red-600">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
        
        <div class="flex gap-2 mt-4">
          <button onclick="cancelAddProduct()" 
            class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
            Cancel
          </button>
          <button onclick="submitProduct()" id="submitProductBtn"
            class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2">
            <i data-lucide="check" class="w-4 h-4"></i>
            Add Product
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-2xl shadow-lg p-4 mb-6 flex flex-wrap gap-3">
    <input id="searchInput" type="text" placeholder="Search products..." 
      class="flex-1 min-w-[200px] px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
    
    <select id="categoryFilter" 
      class="px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      <option value="">All Categories</option>
      <option value="Food">Food & Beverage</option>
      <option value="Tech">Technology</option>
      <option value="Fashion">Fashion</option>
      <option value="Beauty">Beauty</option>
      <option value="Services">Services</option>
      <option value="Other">Other</option>
    </select>
    
    <select id="sortFilter" 
      class="px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      <option value="newest">Newest First</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
    </select>
  </div>

  <!-- Loading indicator -->
  <div id="loadingIndicator" class="bg-white rounded-2xl shadow-lg p-12 text-center">
    <i data-lucide="loader" class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3"></i>
    <p class="text-gray-500">Loading products...</p>
  </div>

  <!-- Products Grid -->
  <div id="productsContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-20"></div>

</div>

<!-- Product Detail Modal -->
<div id="productModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-2xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-start mb-4">
      <h3 id="modalTitle" class="text-2xl font-bold text-gray-800"></h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>
    
    <img id="modalImage" src="" class="w-full h-64 object-cover rounded-xl mb-4" />
    
    <div class="mb-4">
      <span id="modalCategory" class="inline-block bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-medium"></span>
      <p id="modalPrice" class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mt-2"></p>
    </div>
    
    <p id="modalDescription" class="text-gray-700 mb-4"></p>
    
    <div class="mb-4 p-4 bg-gray-50 rounded-lg">
      <p class="text-sm font-semibold text-gray-700 mb-2">Vendor Information</p>
      <div id="modalVendor" class="flex items-center gap-3">
        <div id="vendorAvatar" class="w-12 h-12 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white font-semibold"></div>
        <div>
          <p id="vendorName" class="font-semibold text-gray-800"></p>
          <p id="vendorCategory" class="text-sm text-gray-600"></p>
        </div>
      </div>
    </div>
    
    <div class="flex gap-2">
      <button onclick="addToCartFromModal()" 
        class="flex-1 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-3 rounded-lg font-semibold hover:shadow-lg transition-all flex items-center justify-center gap-2">
        <i data-lucide="shopping-cart" class="w-4 h-4"></i>
        Add to Cart
      </button>
      <button onclick="contactVendor()" 
        class="flex-1 bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 font-semibold flex items-center justify-center gap-2">
        <i data-lucide="message-circle" class="w-4 h-4"></i>
        Contact
      </button>
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 inset-x-0 bg-white/90 backdrop-blur-lg border-t border-gray-200 shadow-lg md:hidden">
  <div class="flex justify-around py-3">
    <a href="feed.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Feed</span>
    </a>
    <a href="search.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="search" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Search</span>
    </a>
    <a href="marketplace.html" class="flex flex-col items-center text-blue-600">
      <i data-lucide="shopping-bag" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Market</span>
    </a>
    <a href="inbox.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="message-circle" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Inbox</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center text-gray-600">
      <i data-lucide="user" class="w-6 h-6"></i>
      <span class="text-xs font-medium mt-1">Profile</span>
    </a>
  </div>
</nav>

<script type="module">
  lucide.createIcons();
  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, doc, getDoc, deleteDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const app = initializeApp({
    apiKey: "AIzaSyDEsYzVYNvSsKvgFk5cSa_7lWWdJtDc1gs",
    authDomain: "online-mall-4422.firebaseapp.com",
    projectId: "online-mall-4422",
    storageBucket: "online-mall-4422.appspot.com"
  });

  const db = getFirestore(app);
  const auth = getAuth(app);
  const storage = getStorage(app);

  let currentUser = null;
  let userProfile = null;
  let allProducts = [];
  let cart = JSON.parse(localStorage.getItem("cart") || "[]");
  let selectedProduct = null;

  updateCartBadge();

  onAuthStateChanged(auth, async user => {
    if (!user) return location.href = "login.html";
    currentUser = user;
    
    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        userProfile = userDoc.data();
        
        const displayName = userProfile.businessName || userProfile.name || 'User';
        const initial = displayName.charAt(0).toUpperCase();
        document.getElementById('userAvatar').textContent = initial;
        
        // Show add product section for business/premium users
        if (userProfile.subscriptionType === 'business' || userProfile.subscriptionType === 'premium') {
          document.getElementById('addProductSection').classList.remove('hidden');
        }
      }
      
      await fetchProducts();
    } catch (error) {
      console.error('Error initializing:', error);
      alert('Error loading profile. Please refresh the page.');
    }
  });

  async function fetchProducts() {
    try {
      const productsSnap = await getDocs(collection(db, "vendors"));
      const products = [];
      
      // Fetch all users for vendor info
      const usersSnap = await getDocs(collection(db, "users"));
      const usersMap = {};
      usersSnap.forEach(userDoc => {
        usersMap[userDoc.id] = userDoc.data();
      });
      
      // Get all products from all vendors
      for (const vendorDoc of productsSnap.docs) {
        const vendorId = vendorDoc.id;
        const vendorData = usersMap[vendorId] || {};
        
        // Get products subcollection
        const productsSnap = await getDocs(collection(db, "vendors", vendorId, "products"));
        
        productsSnap.forEach(productDoc => {
          const productData = { 
            id: productDoc.id,
            vendorId: vendorId,
            vendorName: vendorData.businessName || vendorData.name || 'Unknown Vendor',
            vendorCategory: vendorData.category || '',
            ...productDoc.data() 
          };
          products.push(productData);
        });
      }
      
      allProducts = products.sort((a, b) => {
        const timeA = a.createdAt?.seconds || 0;
        const timeB = b.createdAt?.seconds || 0;
        return timeB - timeA;
      });
      
      document.getElementById('loadingIndicator').classList.add('hidden');
      document.getElementById('productsContainer').classList.remove('hidden');
      
      applyFilters();
    } catch (error) {
      console.error('Error fetching products:', error);
      alert('Error loading products. Please refresh the page.');
    }
  }

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const sort = document.getElementById('sortFilter').value;

    let filtered = allProducts.filter(p => {
      const searchMatch = !search || 
        p.name?.toLowerCase().includes(search) || 
        p.description?.toLowerCase().includes(search);
      const categoryMatch = !category || p.category === category;
      return searchMatch && categoryMatch;
    });

    // Sort
    if (sort === 'price-low') {
      filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
    } else if (sort === 'price-high') {
      filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
    } else {
      filtered.sort((a, b) => {
        const timeA = a.createdAt?.seconds || 0;
        const timeB = b.createdAt?.seconds || 0;
        return timeB - timeA;
      });
    }

    renderProducts(filtered);
  }

  function renderProducts(products) {
    const container = document.getElementById('productsContainer');
    container.innerHTML = '';

    if (products.length === 0) {
      container.innerHTML = `
        <div class="col-span-full text-center py-12">
          <i data-lucide="package" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
          <p class="text-gray-500 text-lg">No products found</p>
          <p class="text-gray-400 text-sm mt-2">Try adjusting your filters</p>
        </div>
      `;
      lucide.createIcons();
      return;
    }

    products.forEach(product => {
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl shadow-lg hover:shadow-xl transition cursor-pointer overflow-hidden fade-in';
      card.onclick = () => openProductModal(product);

      card.innerHTML = `
        ${product.imageURL ? `
          <img src="${product.imageURL}" class="w-full h-48 object-cover" />
        ` : `
          <div class="w-full h-48 bg-gradient-to-br from-blue-200 to-purple-200 flex items-center justify-center">
            <i data-lucide="package" class="w-16 h-16 text-white"></i>
          </div>
        `}
        
        <div class="p-4">
          <div class="flex justify-between items-start mb-2">
            <h3 class="font-bold text-lg text-gray-800 line-clamp-1">${product.name || 'Unnamed Product'}</h3>
            <span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-medium">${product.category || 'Other'}</span>
          </div>
          
          <p class="text-sm text-gray-600 mb-3 line-clamp-2">${product.description || 'No description'}</p>
          
          <div class="flex items-center gap-2 mb-3">
            <div class="w-6 h-6 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-white text-xs font-bold">
              ${(product.vendorName || 'V').charAt(0).toUpperCase()}
            </div>
            <span class="text-xs text-gray-500">${product.vendorName || 'Unknown Vendor'}</span>
          </div>
          
          <div class="flex justify-between items-center">
            <span class="font-bold text-2xl bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
              R ${parseFloat(product.price || 0).toFixed(2)}
            </span>
            <button onclick="event.stopPropagation(); addToCart('${product.id}', '${product.vendorId}')" 
              class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-2 rounded-lg hover:shadow-lg transition-all text-sm font-semibold flex items-center gap-2">
              <i data-lucide="shopping-cart" class="w-4 h-4"></i>
              Add
            </button>
          </div>
        </div>
      `;

      container.appendChild(card);
    });

    lucide.createIcons();
  }

  function openProductModal(product) {
    selectedProduct = product;
    
    document.getElementById('modalTitle').textContent = product.name || 'Product';
    document.getElementById('modalDescription').textContent = product.description || 'No description available';
    document.getElementById('modalPrice').textContent = `R ${parseFloat(product.price || 0).toFixed(2)}`;
    document.getElementById('modalCategory').textContent = product.category || 'Other';
    
    if (product.imageURL) {
      document.getElementById('modalImage').src = product.imageURL;
      document.getElementById('modalImage').classList.remove('hidden');
    } else {
      document.getElementById('modalImage').classList.add('hidden');
    }

    // Vendor info
    const vendorAvatar = document.getElementById('vendorAvatar');
    const vendorName = document.getElementById('vendorName');
    const vendorCategory = document.getElementById('vendorCategory');
    
    vendorAvatar.textContent = (product.vendorName || 'V').charAt(0).toUpperCase();
    vendorName.textContent = product.vendorName || 'Unknown Vendor';
    vendorCategory.textContent = product.vendorCategory || 'Vendor';

    document.getElementById('productModal').classList.remove('hidden');
    lucide.createIcons();
  }

  window.closeModal = () => {
    document.getElementById('productModal').classList.add('hidden');
    selectedProduct = null;
  };

  window.addToCartFromModal = () => {
    if (selectedProduct) {
      addToCart(selectedProduct.id, selectedProduct.vendorId);
      closeModal();
    }
  };

  window.contactVendor = () => {
    if (selectedProduct && selectedProduct.vendorId) {
      window.location.href = `chat.html?uid=${selectedProduct.vendorId}`;
    } else {
      alert('Vendor information not available');
    }
  };

  function addToCart(productId, vendorId) {
    const product = allProducts.find(p => p.id === productId && p.vendorId === vendorId);
    if (!product) return;

    const existingItem = cart.find(c => c.id === productId && c.vendorId === vendorId);
    
    if (existingItem) {
      existingItem.qty = (existingItem.qty || 1) + 1;
    } else {
      cart.push({
        id: product.id,
        vendorId: product.vendorId,
        name: product.name,
        price: product.price,
        imageURL: product.imageURL,
        qty: 1
      });
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
    
    // Show toast
    const toast = document.createElement('div');
    toast.className = 'fixed top-20 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2';
    toast.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> Added to cart!';
    document.body.appendChild(toast);
    lucide.createIcons();
    setTimeout(() => toast.remove(), 2000);
  }

  function updateCartBadge() {
    const count = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
    const badge = document.getElementById('cartBadge');
    if (count > 0) {
      badge.textContent = count;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  window.viewCart = () => {
    window.location.href = 'checkout.html';
  };

  // Add Product Functions
  window.showAddProductForm = () => {
    document.getElementById('productFormContainer').classList.remove('hidden');
  };

  window.cancelAddProduct = () => {
    document.getElementById('productFormContainer').classList.add('hidden');
    document.getElementById('productName').value = '';
    document.getElementById('productPrice').value = '';
    document.getElementById('productDescription').value = '';
    document.getElementById('productImage').value = '';
    document.getElementById('productImagePreview').classList.add('hidden');
  };

  document.getElementById('productImage').onchange = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById('previewProductImg').src = ev.target.result;
        document.getElementById('productImagePreview').classList.remove('hidden');
        lucide.createIcons();
      };
      reader.readAsDataURL(file);
    }
  };

  window.removeProductImage = () => {
    document.getElementById('productImage').value = '';
    document.getElementById('productImagePreview').classList.add('hidden');
  };

  window.submitProduct = async () => {
    const name = document.getElementById('productName').value.trim();
    const price = parseFloat(document.getElementById('productPrice').value);
    const category = document.getElementById('productCategory').value;
    const description = document.getElementById('productDescription').value.trim();
    
    if (!name || !price || isNaN(price)) {
      alert('Please fill in all required fields');
      return;
    }
    
    const submitBtn = document.getElementById('submitProductBtn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Adding...';
    lucide.createIcons();
    
    try {
      let imageURL = null;
      const imageFile = document.getElementById('productImage').files[0];
      
      if (imageFile) {
        const storageRef = ref(storage, `products/${currentUser.uid}/${Date.now()}_${imageFile.name}`);
        await uploadBytes(storageRef, imageFile);
        imageURL = await getDownloadURL(storageRef);
      }
      
      await addDoc(collection(db, "vendors", currentUser.uid, "products"), {
        name,
        price,
        category,
        description,
        imageURL,
        createdAt: serverTimestamp()
      });
      
      alert('Product added successfully!');
      cancelAddProduct();
      await fetchProducts();
    } catch (error) {
      console.error('Error adding product:', error);
      alert('Failed to add product. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Add Product';
      lucide.createIcons();
    }
  };

  // Filter events
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('categoryFilter').addEventListener('change', applyFilters);
  document.getElementById('sortFilter').addEventListener('change', applyFilters);

  // Close modal on escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
</script>

</body>
</html>
